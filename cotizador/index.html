<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AL Cotizador">
<title>AutoLuxuries Cotizador</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f4;--card:#fff;--ink:#0d0d0d;--muted:#666;--line:#e2e2e2;--head:#0a0a0a;--head-ink:#fff;
  --ok:#2f7d4f;--ok-bg:#e4f2e9;--warn:#a46312;--warn-bg:#fbefd9;--bad:#b23b3b;--bad-bg:#f8e3e3;--info:#2f5d9a;--info-bg:#e3ecf8;
  --display:"Sora",system-ui,sans-serif;--body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{--bg:#0b0b0b;--card:#161616;--ink:#f2f2f2;--muted:#a0a0a0;--line:#2b2b2b;--head:#000;--ok:#6fcf97;--ok-bg:#16301f;--warn:#f0b35a;--warn-bg:#352612;--bad:#f08080;--bad-bg:#3a1a1a;--info:#8db6ef;--info-bg:#172438}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
header{background:var(--head);color:var(--head-ink);padding:calc(14px + env(safe-area-inset-top)) 18px 14px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
.brand b{font-family:var(--display);font-weight:600;font-size:18px}
.brand span{display:block;font-size:11px;letter-spacing:.18em;opacity:.7;text-transform:uppercase}
header a{color:#fff;font-size:13px;opacity:.8;text-decoration:none;border:1px solid #444;border-radius:999px;padding:6px 12px}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:22px;margin:0;font-weight:600}
h2{font-family:var(--display);font-size:15px;margin:0 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.hero{background:var(--head);color:#fff;border-radius:18px;padding:18px}
.hero .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;font-weight:600}
.hero .v{font-family:var(--display);font-size:38px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0}
.hero .s{font-size:14px;opacity:.85}
.kv{display:flex;flex-direction:column}
.kv>div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.kv>div:first-child{border-top:0}
.kv span:last-child{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.kv .tot{font-weight:700}
.kv .sub span:first-child{padding-left:14px;color:var(--muted);font-size:14px}
.kv .sub span:last-child{font-weight:500;font-size:14px;color:var(--muted)}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.per{display:flex;gap:6px;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;flex:1}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:7px 0;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.nav{border:1px solid var(--line);background:var(--card);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:18px}
.lbl{text-align:center;font-weight:600;color:var(--muted);font-size:14px}
.tips{display:flex;flex-direction:column;gap:8px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px}
.tip .ic{font-size:20px;line-height:1.2}
.tip.good{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:var(--ok-bg)}
.tip.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line));background:var(--warn-bg)}
.tip.info{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 30%,var(--line))}
.list{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--muted)}
.row .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.f{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.f label{font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);width:100%}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:600;font-size:15px}
.chk input{width:20px;height:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.svrow{display:grid;grid-template-columns:1fr 78px 64px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.svrow input{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);width:100%;text-align:right}
.svhd{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav.tabs button{flex:1;border:0;background:none;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button.on{color:var(--ink)}
nav.tabs svg{width:22px;height:22px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--head);color:#fff}
.login form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.login input{padding:13px;border-radius:12px;border:1px solid #333;background:#111;color:#fff}
.login .logo{font-family:var(--display);font-size:28px;font-weight:600}
.login button{padding:13px;border-radius:12px;border:0;background:#fff;color:#000;font-weight:700}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:9}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet .hd button{border:0;background:none;font-weight:600;color:var(--muted);cursor:pointer}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.recibo{width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin-top:8px}
.fileh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.goal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.goal .big{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.goal .bar{height:12px}
.goal .bar i{background:var(--ok)}
.addbtn{display:flex;gap:8px}
.addbtn .btn{flex:1}

/* ===== Diseño premium (blanco), igual que la app de citas ===== */
:root{--bg:#F2F3F5;--card:#FFFFFF;--ink:#0A0A0A;--muted:#6E737B;--line:#E6E8EB;--fill:#F6F7F9;--head:#FFFFFF;--head-ink:#0A0A0A;
  --ok:#1F7A4D;--ok-bg:#E9F6EF;--warn:#9A5B0C;--warn-bg:#FDF3E2;--bad:#B42318;--bad-bg:#FDECEA;--info:#2457A6;--info-bg:#EAF1FB;
  --display:"Archivo",-apple-system,"SF Pro Display",system-ui,sans-serif;--body:-apple-system,"SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;--r-lg:20px;--r-md:14px;--r-sm:12px}
body{letter-spacing:-.005em}
header{background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);color:var(--ink);border-bottom:1px solid var(--line);padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:12px}
.brand b{font-family:var(--display);font-stretch:118%;font-weight:700;letter-spacing:-.01em}
.brand span{letter-spacing:0;text-transform:none;font-size:13px;opacity:1;color:var(--muted);font-weight:500}
header a{color:var(--ink);border-color:var(--line);opacity:1;background:var(--card);font-weight:600;border-radius:var(--r-sm);padding:8px 12px}
main{padding:22px 16px calc(100px + env(safe-area-inset-bottom));gap:18px}
h1{font-family:var(--display);font-stretch:112%;font-size:30px;font-weight:700;letter-spacing:-.02em}
h2{font-family:var(--body);font-size:17px;font-weight:650;letter-spacing:-.015em;margin-bottom:10px}
.card,.goal{border-radius:var(--r-lg);padding:18px;box-shadow:0 1px 2px rgba(16,24,40,.03)}
.hero{border-radius:var(--r-lg);padding:20px;background:var(--ink)}
.hero .k{text-transform:none;letter-spacing:-.005em;font-size:14px;font-weight:500;opacity:.65}
.hero .v{font-family:var(--display);font-stretch:112%;font-size:44px;font-weight:650;letter-spacing:-.025em;margin:6px 0 4px}
.hero .s{opacity:.72;font-size:14px}
.goal .big{font-family:var(--display);font-stretch:112%;font-size:30px;letter-spacing:-.02em}
.goal .bar{height:10px;margin-top:10px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--line)}
.kv>div{padding:11px 0}
.kv span:last-child{font-family:var(--display);font-stretch:106%;font-weight:600}
.row .r b,.row .r{font-variant-numeric:tabular-nums}
.row .r b{font-family:var(--display);font-stretch:106%;font-weight:650}
.lbl{font-size:15px;color:var(--ink);font-weight:600;letter-spacing:-.01em}
.seg{padding:4px;border-color:var(--line)}
.seg button{padding:8px 0;font-weight:600}
.nav{width:40px;height:40px;font-size:20px;color:var(--ink)}
/* consejos: se conservan los colores, más finos */
.tips{gap:10px}
.tip{border:0;border-radius:var(--r-md);padding:14px 16px;gap:12px;font-size:15px;line-height:1.45;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.tip .ic{flex:0 0 34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--fill)}
.tip.good{background:var(--ok-bg);box-shadow:inset 3px 0 0 var(--ok)}
.tip.good .ic{background:#fff}
.tip.warn{background:var(--warn-bg);box-shadow:inset 3px 0 0 #D08A2C}
.tip.warn .ic{background:#fff}
.tip.info{background:var(--info-bg);box-shadow:inset 3px 0 0 #4A7FCB}
.tip.info .ic{background:#fff}
.tip b{font-weight:650}
/* botones y formularios */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border-radius:var(--r-sm);padding:10px 16px;letter-spacing:-.01em}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.addbtn .btn{min-height:48px}
.f input,.f select,.svrow input{background:var(--fill);border-color:var(--line);border-radius:var(--r-sm);padding:12px 14px;font-size:16px}
.f input:focus,.f select:focus,.svrow input:focus{outline:none;border-color:var(--ink);background:var(--card)}
.sheet{border-radius:24px 24px 0 0;padding-top:22px;position:relative;box-shadow:0 -10px 40px rgba(0,0,0,.12)}
.sheet::before{content:"";position:absolute;top:8px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:9px;background:#D6D9DE}
.sheet .hd h1{font-size:21px}
.ov{background:rgba(10,10,10,.42)}
nav.tabs{background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px)}
nav.tabs button{font-weight:550;font-size:11px;gap:4px}
nav.tabs svg{stroke-width:1.6;width:24px;height:24px}
nav.tabs button.on svg{background:var(--ink);stroke:#fff;border-radius:9px;width:44px;height:28px;padding:3px 0}
.login{background:#000}
.login .logo{font-family:var(--display);font-stretch:118%}
.login input{background:#141414;border-color:#262626}
.toast{border-radius:var(--r-sm);padding:12px 18px}
.hd-r{display:flex;align-items:center;gap:8px}
.gear{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.gear svg{width:22px;height:22px}
.gear.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.now-card{background:var(--warn-bg);border-radius:var(--r-lg);padding:16px;box-shadow:inset 4px 0 0 #D08A2C}
.now-k{font-size:13px;font-weight:600;color:var(--warn)}
.now-t{display:flex;gap:12px;align-items:flex-start;margin-top:6px;font-size:16px;line-height:1.45}
.now-t .ic{flex:0 0 34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:#fff}
details.fold{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
details.fold>summary{list-style:none;cursor:pointer;padding:15px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"⌄";color:var(--muted);font-size:18px;transition:transform .2s}
details.fold[open]>summary::after{transform:rotate(180deg)}

/* ===== Cotizador ===== */
textarea{font:inherit;color:inherit}
.f textarea{padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--fill);width:100%;font-size:16px;resize:vertical}
.f textarea:focus{outline:none;border-color:var(--ink);background:var(--card)}
.step h2{display:flex;align-items:center;gap:10px}
.step h2 i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:0 0 26px}
.seg.wrap{flex-wrap:wrap;border-radius:var(--r-sm)}
.seg.wrap button{flex:1 1 auto;padding:9px 10px;border-radius:9px;font-size:14px}
.inl{display:flex;gap:8px}.inl input{flex:1}.inl .btn{flex:0 0 auto;min-height:46px}
.sug{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;padding:12px;border-radius:var(--r-md);background:var(--info-bg)}
.sug .note{width:100%}
.chip{border:1px solid color-mix(in srgb,var(--info) 35%,var(--line));background:#fff;border-radius:999px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer;text-align:left}
.chip small{display:block;font-weight:500;color:var(--muted);font-size:12px}
button.row{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;cursor:pointer}
button.row:first-child{border-top:0}
.row.pick.on .t{color:var(--ok)}
.row .x{border:0;background:var(--fill);width:30px;height:30px;border-radius:9px;margin-top:6px;cursor:pointer;font-size:18px;color:var(--muted)}
.qty{display:inline-flex;align-items:center;gap:10px;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:2px}
.qty button{border:0;background:var(--fill);width:32px;height:30px;border-radius:8px;font-size:18px;cursor:pointer}
.qty span{min-width:18px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fotos button{padding:0;border:0;background:none;cursor:pointer}
.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r-sm);display:block;background:var(--line)}
label.btn{position:relative;cursor:pointer}
.lnk{border:0;background:none;padding:0;font-weight:600;color:var(--info);cursor:pointer;font-size:15px}
a.btn{text-decoration:none;color:inherit}
.pbar{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:6;display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:18px;padding:8px 8px 8px 16px;color:#fff;background:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:560px;margin:0 auto}
.pbar .pi{display:flex;flex-direction:column;min-width:0}
.pbar .pi small{font-size:12px;opacity:.75;white-space:nowrap}
.pbar .pi.ok small{color:#7EE0A8;opacity:1}.pbar .pi.bad small{color:#FFB4A8;opacity:1}
.pbar .pi b{font-family:var(--display);font-stretch:110%;font-size:20px;font-variant-numeric:tabular-nums}
.pbar .pa{display:flex;gap:6px}
.pbar button{border:0;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;min-height:46px}
.pbar .pb1{background:#fff;color:#0A0A0A;padding:0 20px}
.pbar .pb2{background:#2a2a2a;color:#fff;width:46px;font-size:24px}
.tam{font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-bg);padding:2px 7px;border-radius:999px;vertical-align:2px}
.wiz{display:flex;flex-direction:column;gap:12px}
.wiz-t{display:flex;justify-content:space-between;align-items:baseline}
.dots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dots button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;padding:0}
.dots i{font-style:normal;width:100%;height:30px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.dots .on{color:var(--ink)}.dots .on i{background:var(--ink);color:#fff;border-color:var(--ink)}
.dots .ok i{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.xtra{margin-top:14px;background:var(--fill)}
.step h2 i{display:none}

.jobs{margin-top:14px;padding:12px;border-radius:var(--r-md);background:var(--fill);display:flex;flex-direction:column;gap:8px}
.jk{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.job{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.job.off{opacity:.55}
.job .jt{display:flex;gap:10px;align-items:center;font-weight:650}
.job .jt input{width:20px;height:20px}
.job .jt small{font-weight:600;color:var(--info);font-size:12px}
.job .jd{font-size:13px;color:var(--muted);margin-top:4px;padding-left:30px}
.job .jin{display:flex;gap:10px;margin-top:8px;padding-left:30px;font-size:13px;color:var(--muted)}
.job .jin label{display:flex;align-items:center;gap:6px;white-space:nowrap}
.job .jin input{width:68px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--fill);text-align:right;font-size:16px}
.job.sv{display:flex;flex-direction:column;gap:4px;font-weight:650}
.job.sv small{font-weight:500;color:var(--muted);font-size:13px}
.job.sv .chip{align-self:flex-start;margin-top:4px}
.prow{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.prow input,.prow select{padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--fill);font-size:16px}
.prow>input{width:100%;font-weight:600}
.prow2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.prow2 label{display:flex;align-items:center;gap:6px}

<script type="module">

const fbApp = initializeApp({apiKey:"AIzaSyCLgJjUAdf6x4s4niznjfWdLb-YRb0hoho",authDomain:"autoluxuries.firebaseapp.com",projectId:"autoluxuries",storageBucket:"autoluxuries.firebasestorage.app",messagingSenderId:"315079290347",appId:"1:315079290347:web:2f9f470fae7721bce73dae"});
const auth = getAuth(fbApp);

// ---------- utilidades ----------
const S={servicios:[],citas:[],clientes:[],estimaciones:[],negocio:{},ncfg:{},cot:{},fotos:[],ok:false};
let TAB=(location.hash||"#nueva").slice(1), VER=null;
const $=q=>document.querySelector(q);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,""));return isFinite(n)?n:0};
const money=n=>(n<0?"-":"")+"$"+Math.abs(Math.round(n*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

async function guardar(col,o,id){id=id||uid();const d=JSON.parse(JSON.stringify(o));delete d.id;d.actualizado=Date.now();setDoc(doc(fs,col,id),d).catch(e=>{console.error(e);toast("No se pudo guardar. Revisa tu señal.")});return id}

const opt=(arr,sel)=>arr.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return '<option value="'+esc(v)+'" '+(String(v)===String(sel)?"selected":"")+'>'+esc(l)+'</option>'}).join("");

// ---------- ajustes ----------
const DEF={metaHora:50,mpg:20,gas:4.10,desgaste:0,imprevisto:10,validez:15,base:"",serv:{}};
const CF=()=>{const c=Object.assign({},DEF,S.cot||{});c.serv=Object.assign({},(S.cot&&S.cot.serv)||{});return c};
// impuestos sobre la ganancia, con los mismos datos que AL Números
function tasas(){const n=Object.assign({pctRenta:12,seguroSocial:true,boEstado:false,boEstadoPct:0.471,boCiudad:true,boCiudadPct:0.1},S.ncfg||{});
  const se=n.seguroSocial?0.9235*0.153:0;const t=se+(1-se/2)*num(n.pctRenta)/100;
  const b=((n.boEstado?num(n.boEstadoPct):0)+(n.boCiudad?num(n.boCiudadPct):0))/100;return {t:Math.min(t,0.6),b}}

// ---------- servicios: tiempo y productos (punto de partida, se ajusta en Ajustes) ----------
// h = horas, p = productos ($), a = área (int, ext, ambos, x = extra)
const META={
 "full-car":{h:4,p:14,a:"ambos"},"full-suv":{h:4.5,p:16,a:"ambos"},"full-truck":{h:5,p:18,a:"ambos"},
 "int-car":{h:2.5,p:9,a:"int"},"int-suv":{h:3,p:10,a:"int"},"int-truck":{h:3,p:10,a:"int"},
 "ext-car":{h:1.5,p:6,a:"ext"},"ext-suv":{h:1.75,p:7,a:"ext"},"ext-truck":{h:2,p:8,a:"ext"},
 "paint":{h:6,p:25,a:"ext"},"ceramic":{h:10,p:120,a:"ext"},"custom":{h:3,p:10,a:"ambos"},"wheel":{h:1.5,p:12,a:"x"},
 "boat-wash":{ft:{rate:8,min:150,h:.08,p:.4},a:"ext"},"boat-wax":{ft:{rate:20,min:300,h:.2,p:1},a:"ext"},"boat-int":{h:3,p:15,a:"int"},
 "rv-wash":{ft:{rate:5,min:150,h:.06,p:.3},a:"ext"},"rv-wax":{ft:{rate:12,min:300,h:.15,p:.8},a:"ext"},"rv-full":{ft:{rate:16,min:400,h:.22,p:1.2},a:"ambos"},
 "x-pet":{h:.75,p:2,a:"x"},"x-petstain":{h:1.25,p:5,a:"x"},"x-shampoo":{h:.5,p:4,a:"x"},"x-wax":{h:.75,p:6,a:"x"},"x-carnauba":{h:.5,p:6,a:"x"},"x-engine":{h:1,p:6,a:"x"},"x-vacuum":{h:.75,p:1,a:"int"},"x-mold":{h:1,p:8,a:"x"},
 "fab-front":{h:.75,p:15,a:"x"},"fab-seats-car":{h:1,p:25,a:"x"},"fab-seats-suv":{h:1.25,p:30,a:"x"},"fab-seats-3row":{h:1.5,p:38,a:"x"},
 "fab-seats-car-ai":{h:3,p:33,a:"x"},"fab-seats-suv-ai":{h:3.75,p:40,a:"x"},"fab-seats-3row-ai":{h:4.5,p:50,a:"x"},
 "fab-pkg-car":{h:1.75,p:45,a:"x"},"fab-pkg-suv":{h:2.25,p:55,a:"x"},"fab-pkg-3row":{h:3,p:70,a:"x"},
 "fab-pkg-car-ai":{h:4.75,p:58,a:"x"},"fab-pkg-suv-ai":{h:5.75,p:70,a:"x"},"fab-pkg-3row-ai":{h:7,p:90,a:"x"},"fab-area":{h:.5,p:10,a:"x"}};
const CANT=["x-shampoo","x-mold","fab-area","wheel"];
const keyOf=s=>String(s.id||"").startsWith("web-")?s.id.slice(4):s.id;
// los servicios del sitio web salen del catálogo (nombre y precio siempre correctos); los tuyos, de la app de citas
function servs(){const out=CATALOGO.map(([k,n,p,c,desde])=>{const d=byId("servicios","web-"+k)||{};return Object.assign({},d,{id:"web-"+k,key:k,nombre:n,precio:p,categoria:c,desde})}).filter(s=>s.activo!==false);
  S.servicios.forEach(s=>{if(s.nombre&&s.activo!==false&&!String(s.id).startsWith("web-"))out.push(Object.assign({},s,{key:keyOf(s)}))});return out}
function servByKey(k){return servs().find(s=>s.key===k)}
// promedio real de horas de tus trabajos completados (solo citas con un servicio)
let PROM=null;
function promedios(){if(PROM)return PROM;const m={};
  S.citas.forEach(c=>{if(c.estado!=="completada"||!num(c.horasReales))return;const it=c.items&&c.items.length?c.items:[{servicio:c.servicio}];if(it.length!==1)return;const n=it[0].servicio||"";if(!n||n.includes(" + "))return;(m[n]=m[n]||[]).push(num(c.horasReales))});
  PROM={};Object.entries(m).forEach(([k,v])=>{PROM[k]={n:v.length,h:v.reduce((a,b)=>a+b,0)/v.length}});return PROM}
function base(sv){const k=sv.key,M=META[k]||{h:2,p:8,a:"ambos"},cf=CF().serv[k]||{},nc=((S.ncfg&&S.ncfg.costos)||{})[sv.nombre]||{},pr=promedios()[sv.nombre];
  let h=M.h||0,hs="estimado",p=M.p||0,ps="estimado";
  if(num(nc.horas)){h=num(nc.horas);hs="AL Números"}if(num(cf.h)){h=num(cf.h);hs="tus ajustes"}if(pr&&pr.n>=3){h=pr.h;hs="tus trabajos ("+pr.n+")"}
  const kp=costoProductos(k,S.cot);if(kp!=null){p=kp;ps="tus productos"}
  if(num(nc.costo)){p=num(nc.costo);ps="AL Números"}if(cf.p!==undefined&&cf.p!==""){p=num(cf.p);ps="tus ajustes"}
  return {h,hs,p,ps,a:M.a||"ambos",ft:M.ft||null}}

// ---------- cotización en curso ----------
const NIVEL={ligera:.85,normal:1,sucia:1.25,muy:1.5};
const nuevaW=()=>({id:uid(),nuevo:true,clienteId:"",nuevoNombre:"",nuevoTel:"",tipo:"Auto",vehiculo:"",ft:"",direccion:"",millas:"",insp:{int:"normal",ext:"normal",mascotas:"no",manchas:"no",moho:"no",olor:false,pintura:"buena"},quiere:"",necesita:"",items:[],extraH:"",extraP:"",extraNombre:"",jobs:{},precioFinal:"",notas:""});
let W=null;try{W=JSON.parse(localStorage.getItem("cot_borrador")||"null")}catch(e){}if(!W||!W.insp)W=nuevaW();if(!W.jobs)W.jobs={};
function guardarBorrador(){try{localStorage.setItem("cot_borrador",JSON.stringify(W))}catch(e){}}

const misTrabajos=()=>(S.cot&&Array.isArray(S.cot.misTrabajos))?S.cot.misTrabajos:[];
function detectados(w){w=w||W;return detectar((w.quiere||"")+" . "+(w.necesita||""),misTrabajos())}
function jobsCalc(w){w=w||W;return detectados(w).filter(j=>!j.serv).map(j=>{const o=(w.jobs||{})[j.id]||{};return Object.assign({},j,{on:!o.off,h:o.h!==undefined&&o.h!==""?num(o.h):num(j.h),p:o.p!==undefined&&o.p!==""?num(o.p):num(j.p)})})}
function servDeJob(j,w){if(j.serv!=="fab")return j.serv;const t=(w||W).tipo;return t==="Auto"?"fab-seats-car":"fab-seats-suv"}
function calc(w){w=w||W;const cf=CF(),tx=tasas(),mi=NIVEL[w.insp.int]||1,me=NIVEL[w.insp.ext]||1,ft=num(w.ft);
  const lines=[];let web=0,H=0,P=0;
  (w.items||[]).forEach(it=>{const sv=servByKey(it.key)||{key:it.key,nombre:it.nombre,precio:num(it.precio)};const b=base(sv);const cant=Math.max(1,num(it.cant)||1);
    let wv,h,p;if(b.ft){wv=Math.max(b.ft.min,b.ft.rate*ft);h=b.ft.h*(ft||20);p=b.ft.p*(ft||20)}else{wv=num(sv.precio)*cant;h=b.h*cant;p=b.p*cant}
    const f=b.a==="int"?mi:b.a==="ext"?me:b.a==="ambos"?(.6*mi+.4*me):1;const ha=h*f;
    lines.push({key:it.key,nombre:sv.nombre||it.nombre,cant:b.ft?1:cant,web:wv,h:ha,hBase:h,p,hs:b.hs,ft:!!b.ft});web+=wv;H+=ha;P+=p});
  let hx=0,px=0;if(w.insp.olor){hx+=.5;px+=6}
  const jobs=jobsCalc(w);jobs.forEach(j=>{if(j.on){hx+=j.h;px+=j.p}});
  hx+=num(w.extraH);px+=num(w.extraP);H+=hx;P+=px;
  const millas=num(w.millas)*2;const gas=millas*costoMilla(Object.assign({},cf,{mpg:num(cf.mpg)||20}));
  const herr=H?herramientasPorTrabajo(S.cot):0;
  const C=P+gas+herr;const meta=num(cf.metaHora)||50;
  const sinImp=H?(C+meta*H/(1-tx.t))/(1-tx.b):0;const imp=sinImp*num(cf.imprevisto)/100;const real=sinImp+imp;
  const rec=Math.ceil(Math.max(web,real)/5)*5;
  const fin=num(w.precioFinal)||rec;
  const net=(fin*(1-tx.b)-C)*(1-tx.t);const ph=H?net/H:0;
  const impuestos=Math.max(0,(fin*(1-tx.b)-C))*tx.t+fin*tx.b;
  return {lines,jobs,web,H,hx,P,px,gas,herr,millas,C,meta,real,imp,rec,fin,net,ph,impuestos,tx}}

// ---------- vistas ----------
const IC={nueva:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',lista:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',ajustes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'};
const VIEWS={nueva:vNueva,lista:vLista,ajustes:vAjustes,ver:vVer};
function render(){if(!S.ok)return;if(!VIEWS[TAB])TAB="nueva";PROM=null;
  const y=window.scrollY,keep=$("#app main")&&$("#app").dataset.tab===TAB;
  const tabs=[["nueva","Cotizar"],["lista","Cotizaciones"],["ajustes","Ajustes"]];

  if(keep)window.scrollTo(0,y);else window.scrollTo(0,0);
  if(TAB==="nueva"||TAB==="ver")verFotos(TAB==="nueva"?W.id:VER)}
function barra(){const k=calc(),P=W.paso||1,ok=k.ph>=k.meta-0.5;
  const info=W.items.length?'<span class="pi '+(ok?"ok":"bad")+'"><small>'+money0(k.net)+' limpio · '+money0(k.ph)+'/h</small><b>'+money0(k.fin)+'</b></span>':'<span class="pi"><small>Paso '+P+' de 4</small><b>'+["Cliente","Revisión","Servicios","Precio"][P-1]+'</b></span>';
  return '<div class="pbar">'+info+'<span class="pa">'+(P>1?'<button type="button" class="pb2" data-a="paso" data-v="'+(P-1)+'" aria-label="Atrás">‹</button>':"")+(P<4?'<button type="button" class="pb1" data-a="paso" data-v="'+(P+1)+'">Siguiente</button>':'<button type="button" class="pb1" data-a="guardar">Guardar</button>')+'</span></div>'}

// --- paso a paso ---
function vNueva(){const w=W,cli=w.clienteId?byId("clientes",w.clienteId):null;const k=calc();
  const cliOpts='<option value="">Elige un cliente…</option><option value="__nuevo" '+(w.clienteId==="__nuevo"?"selected":"")+'>+ Cliente nuevo</option>'+S.clientes.slice().sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||"")).map(c=>'<option value="'+esc(c.id)+'" '+(c.id===w.clienteId?"selected":"")+'>'+esc(c.nombre)+'</option>').join("");
  const vehs=cli&&cli.vehiculos?cli.vehiculos:[];
  const esFt=w.tipo==="Bote"||w.tipo==="RV / Casa rodante";
  const P=W.paso||1;const PASOS=["Cliente","Revisión","Servicios","Precio"];
  let h='<div class="wiz"><div class="wiz-t"><h1>'+(w.nuevo?"Cotizar":"Editar cotización")+'</h1><button type="button" class="lnk" data-a="descartar">'+(w.nuevo?"Empezar de nuevo":"Cancelar")+'</button></div><div class="dots">'+PASOS.map((t,i)=>'<button type="button" data-a="paso" data-v="'+(i+1)+'" class="'+(P===i+1?"on":P>i+1?"ok":"")+'"><i>'+(P>i+1?"✓":i+1)+'</i>'+t+'</button>').join("")+'</div></div>';
  // 1
  if(P===1)h+='<section class="card step"><h2><i>1</i>Cliente y vehículo</h2><div class="f"><label for="w_cli">Cliente</label><select id="w_cli" data-w="clienteId">'+cliOpts+'</select></div>'+
   (w.clienteId==="__nuevo"?'<div class="g2"><div class="f"><label for="w_nn">Nombre</label><input id="w_nn" data-w="nuevoNombre" value="'+esc(w.nuevoNombre)+'"></div><div class="f"><label for="w_nt">Teléfono</label><input id="w_nt" type="tel" data-w="nuevoTel" value="'+esc(w.nuevoTel)+'"></div></div>':"")+
   '<div class="g2"><div class="f"><label for="w_tipo">Tipo</label><select id="w_tipo" data-w="tipo">'+opt(["Auto","SUV / Camioneta","Pickup","Bote","RV / Casa rodante"],w.tipo)+'</select></div><div class="f"><label for="w_veh">Vehículo</label><input id="w_veh" data-w="vehiculo" list="w_vdl" placeholder="2021 Toyota RAV4" value="'+esc(w.vehiculo)+'"><datalist id="w_vdl">'+vehs.map(v=>'<option value="'+esc(v.desc)+'"></option>').join("")+'</datalist></div></div>'+
   (esFt?'<div class="f"><label for="w_ft">Largo (pies)</label><input id="w_ft" inputmode="decimal" data-w="ft" value="'+esc(w.ft)+'" placeholder="Ej. 24"></div>':"")+
   '<div class="f"><label for="w_dir">Dirección del trabajo</label><input id="w_dir" data-w="direccion" value="'+esc(w.direccion||(cli&&cli.direccion)||"")+'"></div>'+
   '<div class="f"><label for="w_mi">Millas de ida (desde tu base)</label><div class="inl"><input id="w_mi" inputmode="decimal" data-w="millas" value="'+esc(w.millas)+'" placeholder="Ej. 12"><button type="button" class="btn" data-a="mapa">Ver en Mapas</button></div></div><p class="note" id="w_minote">Cuento ida y vuelta: '+(num(w.millas)*2)+' millas · gasolina '+money(k.gas)+'.</p></section>';
  // 2
  const seg=(campo,arr)=>'<div class="seg wrap">'+arr.map(([v,l])=>'<button type="button" data-a="insp" data-k="'+campo+'" data-v="'+v+'" class="'+(w.insp[campo]===v?"on":"")+'">'+l+'</button>').join("")+'</div>';
  if(P===2)h+='<section class="card step"><h2><i>2</i>Fotos e inspección</h2><div id="fotos" class="fotos"></div><label class="btn" style="margin-top:10px;width:100%">📷 Tomar o agregar fotos<input type="file" accept="image/*" multiple class="fileh" id="w_foto"></label><p class="note">Toma fotos de cada problema: manchas, pelo de mascota, moho, rayones. Van en la cotización del cliente.</p>'+
   (w.tipo==="Bote"||w.tipo==="RV / Casa rodante"?"":'<div class="f"><label>Interior</label>'+seg("int",[["ligera","Limpio"],["normal","Normal"],["sucia","Sucio"],["muy","Muy sucio"]])+'</div>')+
   '<div class="f"><label>Exterior</label>'+seg("ext",[["ligera","Limpio"],["normal","Normal"],["sucia","Sucio"],["muy","Muy sucio"]])+'</div>'+
   (w.tipo==="Bote"||w.tipo==="RV / Casa rodante"?"":'<div class="f"><label>Pelo de mascota</label>'+seg("mascotas",[["no","Nada"],["poco","Poco"],["mucho","Mucho"]])+'</div><div class="f"><label>Manchas en asientos o alfombra</label>'+seg("manchas",[["no","Ninguna"],["algunas","Algunas"],["muchas","Muchas"]])+'</div>')+
   '<div class="f"><label>Moho o lama</label>'+seg("moho",[["no","No"],["int","Adentro"],["ext","Afuera"],["ambos","Los dos"]])+'</div>'+

function sugerencias(){const w=W,i=w.insp,tiene=k=>w.items.some(x=>x.key===k),out=[];const add=(k,c,por)=>{const s=servByKey(k);if(s&&!tiene(k))out.push([k,c||1,s,por])};
  if(i.mascotas==="poco")add("x-pet",1,"pelo de mascota");if(i.mascotas==="mucho")add(i.manchas!=="no"?"x-petstain":"x-pet",1,"mucho pelo de mascota");
  if(i.manchas==="algunas")add("x-shampoo",2,"manchas");if(i.manchas==="muchas")add("x-shampoo",5,"muchas manchas");

  detectados(w).filter(j=>j.serv).forEach(j=>add(servDeJob(j,w),1,"lo que escribiste"));if(i.pintura==="opaca"&&!tiene("paint"))add("x-wax",1,"pintura opaca");
  if(!w.items.some(x=>!/^(x-|fab-|wheel)/.test(x.key))){const t=w.tipo,suf=t==="Auto"?"car":t==="Pickup"?"truck":"suv";if(t==="Bote")add("boat-wash",1,"punto de partida");else if(t==="RV / Casa rodante")add("rv-wash",1,"punto de partida");else{const q=(w.quiere+" "+w.necesita).toLowerCase();const k=/inter|asiento|alfombra|seat|carpet/.test(q)&&!/exter|lavad|wash|cera/.test(q)?"int":/exter|wash|lavad/.test(q)&&!/inter/.test(q)?"ext":"full";add(k+"-"+suf,1,"según el vehículo")}}
  if(!out.length)return "";

function selHTML(k){if(!W.items.length)return '<p class="empty">Todavía no hay servicios.</p>';

function sheet(title,body,foot){closeSheet();const ov=document.createElement("div");ov.className="ov";ov.id="ov";
  ov.innerHTML='<div class="sheet" role="dialog" aria-label="'+esc(title)+'"><div class="hd"><h1>'+esc(title)+'</h1><button type="button" data-a="close">Cerrar</button></div>'+body+(foot?'<div class="btns" style="margin-top:16px">'+foot+'</div>':"")+'</div>';
  ov.addEventListener("click",e=>{if(e.target===ov)closeSheet()});document.body.appendChild(ov)}
function closeSheet(){const o=$("#ov");if(o)o.remove()}
function elegir(){const t=W.tipo,cat={"Auto":"Auto","SUV / Camioneta":"SUV / Camioneta","Pickup":"Pickup","Bote":"Bote","RV / Casa rodante":"RV / Casa rodante"}[t];
  const lancha=t==="Bote"||t==="RV / Casa rodante";
  const ok=s=>{if(s.categoria===cat)return true;if(["Auto","SUV / Camioneta","Pickup","Bote","RV / Casa rodante"].includes(s.categoria))return false;
    if(s.categoria==="Protección de tela"){if(lancha)return false;if(/front|area/.test(s.key))return true;return t==="Auto"?/-car/.test(s.key):!/-car/.test(s.key)}
    if(lancha)return /mold|custom/.test(s.key)||!String(s.id).startsWith("web-");return true};
  const TAM=["Auto","SUV / Camioneta","Pickup"],esAuto=TAM.includes(cat);
  const okT=s=>esAuto&&TAM.includes(s.categoria)?true:ok(s);
  const ordT=s=>{const tipoS=["full-","int-","ext-"].findIndex(x=>s.key.startsWith(x));return (tipoS<0?9:tipoS)*10+(s.categoria===cat?0:1+TAM.indexOf(s.categoria))};
  const grupos={};servs().filter(okT).forEach(s=>{const g=(s.categoria===cat||(esAuto&&TAM.includes(s.categoria)))?"Servicios":s.key.startsWith("x-")?"Extras":s.categoria==="Protección de tela"?"Protección de tela":"Otros servicios";(grupos[g]=grupos[g]||[]).push(s)});
  let b="";["Servicios","Extras","Otros servicios","Protección de tela"].forEach(g=>{if(!grupos[g])return;b+='<h2 style="margin-top:14px">'+g+'</h2><div class="list">'+grupos[g].sort((a,c)=>g==="Servicios"&&esAuto?ordT(a)-ordT(c):num(a.precio)-num(c.precio)).map(s=>{const bs=base(s),ya=W.items.some(x=>x.key===s.key);return '<button type="button" class="row pick'+(ya?" on":"")+'" data-a="pick" data-k="'+esc(s.key)+'"><div style="text-align:left"><div class="t">'+esc(s.nombre)+(esAuto&&s.categoria===cat&&g==="Servicios"?' <small class="tam">su tamaño</small>':"")+'</div><div class="s">'+(bs.ft?"por pie":"≈ "+hTxt(bs.h))+' · productos '+(bs.ft?money(bs.ft.p)+"/pie":money0(bs.p))+'</div></div><div class="r"><b>'+(s.desde?"desde ":"")+money0(num(s.precio))+'</b>'+(ya?'<div class="s">agregado</div>':"")+'</div></button>'}).join("")+'</div>'});
  if(!b)b='<p class="empty">No hay servicios para este tipo. Revisa que la app de citas tenga tus servicios del sitio web.</p>';
  sheet("Agregar servicio",b)}
