<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>Your detail progress · AutoLuxuries</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&display=swap" rel="stylesheet">
<style>
/* Página pública: el cliente ve en vivo en qué parte va su servicio. Mismo estilo blanco premium de la app. */
:root{--bg:#F2F3F5;--card:#fff;--ink:#0A0A0A;--muted:#6E737B;--line:#E6E8EB;--fill:#F6F7F9;--ok:#1F7A4D;--ok-bg:#E9F6EF;
  --display:"Archivo",-apple-system,"SF Pro Display",system-ui,sans-serif;--body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;letter-spacing:-.005em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
header{background:#fff;border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 18px 14px;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:var(--display);font-stretch:118%;font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-weight:500}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.lang button.on{background:var(--ink);color:#fff}
main{max-width:520px;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;gap:16px}
.hello{font-size:15px;color:var(--muted);margin:0}
h1{font-family:var(--display);font-stretch:112%;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.gauge{display:flex;align-items:center;gap:20px}
.ring{position:relative;width:132px;height:132px;flex:0 0 132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--fill)}
.ring .val{stroke:var(--ink);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring.done .val{stroke:var(--ok)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-stretch:112%;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.now b{display:block;font-family:var(--display);font-stretch:108%;font-size:21px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.now p{margin:6px 0 0;color:var(--muted);font-size:15px}
.now small{display:block;margin-top:10px;color:var(--muted);font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ok);font-weight:600;margin-top:10px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}.ring .val{transition:none}}
ol{list-style:none;margin:0;padding:0}
ol li{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
ol li:first-child{border-top:0}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin-top:1px;background:#fff}
li.done .dot{background:var(--ink);border-color:var(--ink)}
li.done .dot::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
li.cur .dot{border-color:var(--ink)}
li.cur .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
li .t{font-weight:600}
li:not(.done):not(.cur) .t{color:var(--muted);font-weight:500}
li .s{font-size:14px;color:var(--muted)}
li .h{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.veh{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.veh span:first-child{color:var(--muted)}
.contact{text-align:center;color:var(--muted);font-size:14px}
.contact a{color:var(--ink);font-weight:700}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
</style>
</head>
<body>
<header><div class="brand">Auto<span>Luxuries</span></div><div class="lang" role="group" aria-label="Language"><button type="button" data-l="en">EN</button><button type="button" data-l="es">ES</button></div></header>
<main id="main" aria-live="polite"><div class="empty">Loading…</div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const qs=new URLSearchParams(location.search);
const ID=(qs.get("id")||"").replace(/[^A-Za-z0-9_-]/g,"");
let L=(qs.get("lang")||(navigator.language||"en")).toLowerCase().startsWith("es")?"es":"en";
const $=q=>document.querySelector(q);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STEPS=[0,25,50,75,100];
const T={
  en:{title:"Your detail progress",hi:n=>"Hi "+n+",",veh:"Vehicle",svc:"Service",live:"Live updates",upd:"Updated",
    s:{0:["We've started","Your detailer has arrived and started working on your vehicle."],25:["25% done","The first part of your service is underway."],50:["Halfway there","We're about halfway through your service."],75:["Final touches","We're finishing the last details."],100:["Your vehicle is ready!","Come on out whenever you're ready to take a look."]},
    wait:["Getting ready","Your detail hasn't started yet. This page will update on its own."],
    nf:"We couldn't find this service. Please check the link we sent you.",q:'Questions? Text us at <a href="sms:+13608596559">360-859-6559</a>.'},
  es:{title:"El progreso de su servicio",hi:n=>"Hola "+n+",",veh:"Vehículo",svc:"Servicio",live:"Se actualiza en vivo",upd:"Actualizado",
    s:{0:["Comenzamos","Su detallador ya llegó y empezó a trabajar en su vehículo."],25:["Vamos en 25%","La primera parte de su servicio está en proceso."],50:["Vamos a la mitad","Ya vamos a la mitad de su servicio."],75:["Detalles finales","Estamos terminando los últimos detalles."],100:["¡Su vehículo está listo!","Cuando guste, puede salir a verlo."]},
    wait:["Preparándonos","Su servicio todavía no empieza. Esta página se actualiza sola."],
    nf:"No encontramos este servicio. Revise el enlace que le enviamos.",q:'¿Preguntas? Escríbanos al <a href="sms:+13608596559">360-859-6559</a>.'}};
let D=null,nf=false;
const hora=ts=>{try{return new Date(ts).toLocaleTimeString(L==="es"?"es-US":"en-US",{hour:"numeric",minute:"2-digit"})}catch(e){return ""}};
function render(){const t=T[L];document.documentElement.lang=L;document.title=t.title+" · AutoLuxuries";
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
  if(nf||!ID){$("#main").innerHTML='<div class="empty">'+t.nf+'</div><p class="contact">'+t.q+'</p>';return}
  if(!D){$("#main").innerHTML='<div class="empty">'+(L==="es"?"Cargando…":"Loading…")+'</div>';return}
  const pct=typeof D.pct==="number"?D.pct:-1,hist=D.hist||{};
  const cur=pct>=0?t.s[pct]||[pct+"%",""]:t.wait;
  const C=2*Math.PI*56,off=C*(1-Math.max(0,pct)/100);
  let h='<div><p class="hello">'+esc(D.nombre?t.hi(D.nombre):"")+'</p><h1>'+t.title+'</h1></div>';
  h+='<div class="card"><div class="gauge"><div class="ring'+(pct>=100?" done":"")+'" role="img" aria-label="'+Math.max(0,pct)+'%"><svg viewBox="0 0 132 132"><circle class="track" cx="66" cy="66" r="56" fill="none" stroke-width="12"/><circle class="val" cx="66" cy="66" r="56" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg><b>'+Math.max(0,pct)+'%</b></div><div class="now"><b>'+esc(cur[0])+'</b><p>'+esc(cur[1])+'</p>'+(pct<100?'<span class="live"><i></i>'+t.live+'</span>':"")+(D.actualizado?'<small>'+t.upd+' '+hora(D.actualizado)+'</small>':"")+'</div></div></div>';
  h+='<div class="card"><ol>'+STEPS.map(p=>{const st=p<pct?"done":p===pct?(p===100?"done":"cur"):"";return '<li class="'+st+'"><span class="dot" aria-hidden="true"></span><div><div class="t">'+esc(t.s[p][0])+'</div></div><span class="h">'+(hist[p]?hora(hist[p]):"")+'</span></li>'}).join("")+'</ol></div>';
  if(D.vehiculo||D.servicio)h+='<div class="card">'+(D.vehiculo?'<div class="veh"><span>'+t.veh+'</span><span>'+esc(D.vehiculo)+'</span></div>':"")+(D.servicio?'<div class="veh" style="margin-top:8px"><span>'+t.svc+'</span><span style="text-align:right">'+esc(D.servicio)+'</span></div>':"")+'</div>';
  h+='<p class="contact">'+t.q+'</p>';
  $("#main").innerHTML=h}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{L=b.dataset.l;render()}));
render();
if(ID){try{const app=initializeApp({apiKey:"AIzaSyCLgJjUAdf6x4s4niznjfWdLb-YRb0hoho",authDomain:"autoluxuries.firebaseapp.com",projectId:"autoluxuries",storageBucket:"autoluxuries.firebasestorage.app",messagingSenderId:"315079290347",appId:"1:315079290347:web:2f9f470fae7721bce73dae"});
  onSnapshot(doc(getFirestore(app),"progreso",ID),d=>{if(!d.exists()){nf=true;D=null}else{nf=false;D=d.data()}render()},()=>{nf=true;render()})}catch(e){nf=true;render()}}
</script>
</body>
</html>
