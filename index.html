<style>
/* Layout: app de una columna para celular, blanco y negro como la marca, barra superior negra, navegación fija abajo */
:root{
  --bg:#f4f4f4; --card:#ffffff; --ink:#0d0d0d; --muted:#666666; --line:#e2e2e2;
  --gold:#0d0d0d; --gold-ink:#0d0d0d; --on-gold:#ffffff; --head:#0a0a0a; --head-ink:#ffffff;
  --ok:#2f7d4f; --ok-bg:#e4f2e9; --warn:#a46312; --warn-bg:#fbefd9; --bad:#b23b3b; --bad-bg:#f8e3e3; --info:#2f5d9a; --info-bg:#e3ecf8;
  --display:"Sora",system-ui,sans-serif; --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root[data-theme="auto"]{
    --bg:#0b0b0b; --card:#161616; --ink:#f2f2f2; --muted:#a0a0a0; --line:#2b2b2b;
    --gold:#ffffff; --gold-ink:#ffffff; --on-gold:#0b0b0b; --head:#000000; --head-ink:#ffffff;
    --ok:#6fcf97; --ok-bg:#16301f; --warn:#f0b35a; --warn-bg:#352612; --bad:#f08080; --bad-bg:#3a1a1a; --info:#8db6ef; --info-bg:#172438;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0b; --card:#161616; --ink:#f2f2f2; --muted:#a0a0a0; --line:#2b2b2b;
  --gold:#ffffff; --gold-ink:#ffffff; --on-gold:#0b0b0b; --head:#000000; --head-ink:#ffffff;
  --ok:#6fcf97; --ok-bg:#16301f; --warn:#f0b35a; --warn-bg:#352612; --bad:#f08080; --bad-bg:#3a1a1a; --info:#8db6ef; --info-bg:#172438;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.login{min-height:100vh;min-height:100dvh;background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.login form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.login .logo{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:.02em}
.login .logo span{font-weight:400;opacity:.85}
.login small{color:#9a9a9a;letter-spacing:.08em;text-transform:uppercase;font-size:12px;margin-top:-10px}
.login .f input,.login input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #2b2b2b;background:#161616;color:#fff}
.login label{font-size:13px;font-weight:700;color:#a0a0a0}
.login .go{background:#fff;color:#0a0a0a;border:0;border-radius:12px;padding:13px;font-weight:700;cursor:pointer}
.login .lnk2{background:none;border:0;color:#cfcfcf;text-decoration:underline;cursor:pointer;align-self:flex-start;padding:0}
.login .err{color:#f08080;font-size:14px;min-height:1em}
.hidden{display:none!important}
header.top{border-bottom:1px solid var(--line);background:var(--head);color:var(--head-ink);padding:calc(14px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 16px calc(18px + env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.02em}
.brand b span{font-weight:400;opacity:.85}
.brand small{font-size:12px;color:#9a9a9a;letter-spacing:.08em;text-transform:uppercase}
.top .plus{background:#ffffff;color:#0a0a0a;border:0;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer}
main{padding:16px;display:flex;flex-direction:column;gap:18px;flex:1}
h1{font-family:var(--display);font-size:22px;margin:0;font-weight:600;text-wrap:balance}
h2{font-family:var(--display);font-size:15px;margin:0;font-weight:600;letter-spacing:.01em;display:flex;align-items:center;justify-content:space-between;gap:8px}
h2 .lnk{font-family:var(--body);font-size:14px;color:var(--gold-ink);background:none;border:0;cursor:pointer;font-weight:600;padding:4px 0}
.section{display:flex;flex-direction:column;gap:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tile .v{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tile.gold{background:var(--head);border-color:var(--line);color:var(--head-ink)}
.tile.gold .k{color:#9a9a9a}.tile.gold .v{color:#ffffff}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--gold) 6%,transparent)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.row .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums;flex-shrink:0}
.when{width:54px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;border-right:1px solid var(--line);padding-right:10px}
.when b{font-family:var(--display);font-size:15px}
.when span{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}.p-mut{background:var(--line);color:var(--muted)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer}
.quick svg{width:22px;height:22px;stroke:var(--gold-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.day{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 2px -2px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs svg{width:22px;height:22px;stroke:currentColor}
nav.tabs button.on{color:var(--gold-ink)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:7px 11px;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.menu{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,12,15,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);gap:10px}
.sheet .hd h3{font-family:var(--display);font-size:17px;margin:0;font-weight:600}
.sheet .hd .x{background:none;border:0;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;padding:6px}
.sheet .bd{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet .ft{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:13px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.f textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.itemrow{display:grid;grid-template-columns:1fr 64px 92px 34px;gap:6px;align-items:center}
.vehrow{display:grid;grid-template-columns:120px 1fr 34px;gap:6px;align-items:center}
.itemrow input,.itemrow select,.vehrow input,.vehrow select{padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);width:100%;min-width:0}
.cvrow{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.cvrow select,.cvrow input{padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);width:100%;min-width:0}
.svs{display:flex;flex-direction:column;gap:8px}
.svrow{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px dashed var(--line)}
.svrow:first-child{border-top:0;padding-top:0}
.svtop{display:grid;grid-template-columns:1fr 92px 34px;gap:6px;align-items:center}
.svtop .del{width:34px;height:34px}
.cvinfo summary{font-size:13px;font-weight:600;color:var(--info);cursor:pointer;padding:2px 0}
.cvinfo .kv{margin-top:6px}
.svfoot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cvsub{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.cvrow .cvh{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fotos button{position:relative;padding:0;border:0;background:none;cursor:pointer}
.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:var(--line)}
.fotos .tag{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px}
.fotoin{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.firma{width:100%;height:170px;border:1.5px dashed var(--line);border-radius:12px;background:#fff;touch-action:none;display:block}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chk label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;background:var(--card)}
.guia{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px;margin:0 0 10px}
.guia summary{cursor:pointer;display:flex;flex-direction:column;gap:2px;list-style:none}
.guia summary::-webkit-details-marker{display:none}
.guia summary small{color:var(--muted)}
.guia h4{margin:14px 0 6px;font-size:14px}
a.btn{text-decoration:none;color:var(--ink)}
a.btn.dark,a.btn.pri{color:#fff}
.hero-who{margin:0 2px -6px;font-size:15px;color:var(--muted)}
.hero-who b{color:var(--ink)}
.hero-card{background:var(--ink);color:#fff;border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px}
.hero-card.hero-done{background:var(--ok)}
.hero-k{font-size:13px;opacity:.65}
.hero-t{font-family:var(--display);font-stretch:110%;font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hero-h{margin:0;font-size:15px;opacity:.85;line-height:1.4}
.hero-clock{font-family:var(--display);font-stretch:112%;font-size:44px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em;opacity:1;color:#7ee2a8}
.hero-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.hero-btns .btn{flex:1 1 140px;min-height:46px;border-radius:12px}
.hero-pri{background:#fff!important;color:var(--ink)!important;border-color:#fff!important}
.hero-sec{background:transparent!important;color:#fff!important;border-color:rgba(255,255,255,.35)!important}
.hero-skip{flex-basis:100%;color:rgba(255,255,255,.7);background:none;border:0;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px 0 0;cursor:pointer;text-align:left}
.hero-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;flex-basis:100%}
.hero-step{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:10px;padding:9px 2px;font-size:12px;font-weight:600;cursor:pointer}
.hero-step.done{opacity:.6}
.hero-step.on{background:#fff;color:var(--ink);border-color:#fff;opacity:1}
.hero-track{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.hero-track span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--fill);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.hero-track span.ok{background:var(--ok-bg);color:var(--ok);box-shadow:none}
.hero-track span.cur{background:var(--ink);color:#fff;box-shadow:none;font-weight:600}
details.todo{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card)}
details.todo>summary{list-style:none;cursor:pointer;padding:15px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
details.todo>summary::-webkit-details-marker{display:none}
details.todo>summary::after{content:"⌄";color:var(--muted);font-size:18px;transition:transform .2s}
details.todo[open]>summary::after{transform:rotate(180deg)}
.todo-in{padding:0 14px 16px;display:flex;flex-direction:column;gap:16px}
.guia .kv span:last-child{white-space:nowrap;padding-left:10px}
.guia ul{margin:0;padding-left:20px;line-height:1.6}
.timer{display:flex;align-items:baseline;gap:12px;padding:6px 0}
.tclock{font-family:var(--display,inherit);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer .s{color:var(--muted);font-size:13px}
.timer.on .tclock{color:var(--ok)}
.tbanner{display:flex;justify-content:space-between;align-items:center;width:100%;background:#0a0a0a;color:#fff;border:0;border-radius:14px;padding:12px 14px;margin:0 0 10px;font:inherit;cursor:pointer;text-align:left}
.tbanner small{display:block;opacity:.7;font-size:12px}
.tbanner b{font-variant-numeric:tabular-nums;font-size:20px;color:#7ee2a8}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.del{background:none;border:0;color:var(--bad);font-size:20px;cursor:pointer;line-height:1}
.kv{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.kv div:first-child{border-top:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-weight:600;overflow-wrap:anywhere}
.total{display:flex;justify-content:space-between;font-family:var(--display);font-size:18px;font-weight:600;padding:4px 2px}
.note{font-size:14px;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:40;max-width:90%;text-align:center}
.copybox{width:100%;min-height:140px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
a.tel{color:var(--gold-ink);font-weight:600;text-decoration:none}
@media (max-width:400px){.g2{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* ===== Diseño premium (blanco): superficies limpias, negro de marca, números tipo tablero ===== */
:root{
  --bg:#F2F3F5; --card:#FFFFFF; --ink:#0A0A0A; --muted:#6E737B; --line:#E6E8EB; --fill:#F6F7F9;
  --gold:#0A0A0A; --gold-ink:#0A0A0A; --on-gold:#FFFFFF; --head:#FFFFFF; --head-ink:#0A0A0A;
  --ok:#1F7A4D; --ok-bg:#E9F6EF; --warn:#9A5B0C; --warn-bg:#FDF3E2; --bad:#B42318; --bad-bg:#FDECEA; --info:#2457A6; --info-bg:#EAF1FB;
  --display:"Archivo",-apple-system,"SF Pro Display",system-ui,sans-serif;
  --body:-apple-system,"SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:12px;
}
body{font-size:16px;letter-spacing:-.005em;line-height:1.45}
.num,.tile .v,.when b,.tclock,.total,.tbanner b,h1{font-family:var(--display);font-stretch:112%;font-variant-numeric:tabular-nums}
/* encabezado */
header.top{background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);color:var(--ink);border-bottom:1px solid var(--line);padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:12px}
.brand b{font-family:var(--display);font-stretch:118%;font-weight:700;font-size:18px;letter-spacing:-.01em;color:var(--ink)}
.brand b span{font-weight:500;opacity:1;color:var(--muted)}
.brand small{display:none}
.top .plus{background:var(--ink);color:#fff;border-radius:var(--r-sm);padding:10px 16px;font-weight:600;font-size:15px;letter-spacing:-.01em}
/* tipografía de página */
main{padding:22px 16px 18px;gap:24px}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
h2{font-family:var(--body);font-size:17px;font-weight:650;letter-spacing:-.015em}
h2 .lnk{color:var(--muted);font-weight:500;font-size:15px}
.section{gap:12px}
.day{text-transform:none;letter-spacing:-.01em;font-size:15px;color:var(--ink);font-weight:650;margin:6px 2px 0}
.note{color:var(--muted);line-height:1.45}
/* indicadores */
.tiles{gap:10px}
.tile{border-radius:var(--r-lg);padding:16px 16px 14px;border:1px solid var(--line);gap:6px}
.tile .k{text-transform:none;letter-spacing:-.005em;font-size:13px;font-weight:500;color:var(--muted)}
.tile .v{font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1.05}
.tile.gold{background:var(--ink);border-color:var(--ink)}
.tile.gold .k{color:rgba(255,255,255,.62)}

.quick svg{stroke-width:1.6;width:24px;height:24px}

.chip{padding:8px 14px;font-weight:550;font-size:14px}
.search{padding:13px 16px;border-radius:var(--r-md);background:var(--card)}
.empty{border-radius:var(--r-lg);border:1px dashed #D6D9DE;padding:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:var(--r-sm);padding:10px 16px;font-weight:600;letter-spacing:-.01em;background:var(--card)}
.btn.sm{min-height:36px;padding:7px 12px;border-radius:10px}
.btn.pri,.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}

nav.tabs{background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px)}
nav.tabs button{padding:8px 2px 9px;font-weight:550;font-size:11px;gap:4px}
nav.tabs svg{width:24px;height:24px;stroke-width:1.6;padding:2px 0}

.sheet{border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.12)}

.sheet .bd{padding:18px;gap:16px}
.sheet .ft{padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.sheet .ft .btn{flex:1}

.f{gap:6px}
.f label{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:-.005em}
.f input,.f select,.f textarea,.cvrow input,.cvrow select,.vehrow input,.vehrow select,.itemrow input,.itemrow select{background:var(--fill);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-size:16px;transition:border-color .15s,background .15s}
.f input:focus,.f select:focus,.f textarea:focus,.cvrow input:focus,.cvrow select:focus{outline:none;border-color:var(--ink);background:var(--card)}
.cvrow{border-radius:var(--r-md);padding:14px;gap:8px}
.chk label{border-radius:var(--r-sm);padding:11px 12px}
/* detalle */
.kv{border-radius:var(--r-lg);padding:4px 16px}
.kv div{padding:12px 0}
.kv span:first-child{color:var(--muted)}
.total{font-size:22px;font-weight:650}
.timer{padding:4px 0 2px}
.tclock{font-size:48px;font-weight:650;letter-spacing:-.02em;line-height:1}
.timer.on .tclock{color:var(--ok)}
.tbanner{border-radius:var(--r-lg);padding:14px 16px;background:var(--ink)}
.tbanner b{font-size:22px;font-weight:650}
.guia{border-radius:var(--r-lg);padding:14px 16px}
.fotos img{border-radius:var(--r-sm)}
.banner{border-radius:var(--r-md)}
.toast{border-radius:var(--r-sm);padding:12px 18px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
a.tel{color:var(--ink);text-decoration:underline;text-decoration-color:#C9CDD3;text-underline-offset:3px}
/* inicio de sesión */
.login{background:#000}
.login .logo{font-family:var(--display);font-stretch:118%;font-weight:700;letter-spacing:-.01em}
.login small{text-transform:none;letter-spacing:0;font-size:14px}
.login .f input,.login input{background:#141414;border-color:#262626;padding:14px 16px;font-size:16px}

// ---------- utilidades ----------
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(n)||0);
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n};
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function toD(s){return new Date(s+"T00:00:00")}
function dStr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){const d=toD(s);d.setDate(d.getDate()+n);return dStr(d)}
function addMonths(s,n){const d=toD(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return dStr(d)}

async function save(col,obj){

  // no esperamos al servidor: así funciona sin señal y se sincroniza después
  setDoc(fsDoc(fs,col,id),JSON.parse(JSON.stringify(o))).catch(handleErr);

}
async function removeDoc(col,id){deleteDoc(fsDoc(fs,col,id)).catch(handleErr)}

function handleErr(e){

function startData(){

      render();

function durDefault(){return num(S.ajustes&&S.ajustes.durDefault)||3}
function bloqueados(){return Array.isArray(S.ajustes&&S.ajustes.bloqueados)?S.ajustes.bloqueados.slice():[]}
let ocupadoActual=null, syncTimer=null;
const HORAS_TRABAJO=[8,9,10,11,12,13,14,15,16];
function calcOcupado(){
  const t=today(), maxD=num(S.ajustes.maxPorDia!=null?S.ajustes.maxPorDia:2), out={};
  S.citas.forEach(c=>{
    if(!c.fecha||c.fecha<t||c.estado==="cancelada")return;
    const o=out[c.fecha]||(out[c.fecha]={fecha:c.fecha,horas:[],citas:0,completo:false});
    o.citas++;
    const dur=num(c.duracion)||durDefault();
    if(!c.hora||dur>=9){o.completo=true;return}
    const h0=parseInt(c.hora.split(":")[0],10), m0=parseInt(c.hora.split(":")[1]||"0",10);
    const fin=h0+m0/60+dur;
    HORAS_TRABAJO.forEach(h=>{if(h+1>h0+m0/60&&h<fin&&!o.horas.includes(h))o.horas.push(h)});
  });
  bloqueados().filter(d=>d>=t).forEach(d=>{(out[d]||(out[d]={fecha:d,horas:[],citas:0,completo:false})).completo=true});
  Object.values(out).forEach(o=>{if(maxD>0&&o.citas>=maxD)o.completo=true;if(HORAS_TRABAJO.every(h=>o.horas.includes(h)))o.completo=true;o.horas.sort((a,b)=>a-b);o.dur=durDefault();delete o.citas});
  return out;
}
function programarSync(){clearTimeout(syncTimer);syncTimer=setTimeout(syncOcupado,1500)}
function syncOcupado(){
  if(mode!=="listo"||ocupadoActual===null)return;
  const nuevo=calcOcupado();
  Object.values(nuevo).forEach(o=>{const v=ocupadoActual[o.fecha];if(!v||v.completo!==o.completo||v.dur!==o.dur||JSON.stringify(v.horas||[])!==JSON.stringify(o.horas))setDoc(fsDoc(fs,"ocupado",o.fecha),o).catch(()=>{})});
  Object.keys(ocupadoActual).forEach(f=>{if(!nuevo[f])deleteDoc(fsDoc(fs,"ocupado",f)).catch(()=>{})});
}

async function cargarCatalogoWeb(){
  if(!(await askConfirm("¿Reemplazar tu lista de servicios por la lista oficial con los precios de tu sitio web? Tus citas y cotizaciones anteriores no cambian.","Sí, reemplazar")))return;
  const nuevos=new Set(CATALOGO_WEB.map(x=>"web-"+x[0]));
  try{
    for(const v of S.servicios){if(!nuevos.has(v.id))await deleteDoc(fsDoc(fs,"servicios",v.id))}
    for(const [k,n,p,c,desde,d] of CATALOGO_WEB){await setDoc(fsDoc(fs,"servicios","web-"+k),{nombre:n,precio:p,categoria:c,desde:desde,descripcion:d,duracion:"",actualizado:Date.now()})}
    toast("Lista de servicios actualizada");
  }catch(e){handleErr(e)}
}

function exportar(){
  const data={app:"AutoLuxuries",version:1,fecha:new Date().toISOString(),ajustes:S.ajustes};
  COLS.forEach(c=>data[c]=S[c]);
  const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="autoluxuries-respaldo-"+today()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  toast("Respaldo descargado");
}
async function importar(file){
  let data;try{data=JSON.parse(await file.text())}catch(e){return toast("Ese archivo no es un respaldo válido.")}
  const tareas=[];
  for(const c of COLS){if(Array.isArray(data[c]))for(const r of data[c]){if(r&&r.id){const o=Object.assign({},r);const id=o.id;delete o.id;o.actualizado=Date.now();tareas.push(()=>setDoc(fsDoc(fs,c,id),JSON.parse(JSON.stringify(o))))}}}
  if(data.ajustes&&typeof data.ajustes==="object"&&Object.keys(data.ajustes).length)tareas.push(()=>setDoc(fsDoc(fs,"ajustes","negocio"),Object.assign({},S.ajustes,data.ajustes)));
  let ok=0,mal=0,ultimo="";
  toast("Importando "+tareas.length+" registros… no cierres la app.");
  for(let i=0;i<tareas.length;i+=25){
    const r=await Promise.allSettled(tareas.slice(i,i+25).map(f=>f()));
    r.forEach(x=>{if(x.status==="fulfilled")ok++;else{mal++;ultimo=(x.reason&&x.reason.code)||""}});
    toast("Importando… "+(ok+mal)+" de "+tareas.length);
  }
  if(mal){openSheet("La importación no terminó bien",'<p style="margin:0">Se guardaron <b>'+ok+'</b> registros y fallaron <b>'+mal+'</b>.</p><p class="note" style="margin:0">'+(ultimo==="permission-denied"?"Firebase no dio permiso. Revisa que las reglas de Firestore estén publicadas y que hayas entrado con tu correo.":"Revisa tu conexión a internet e intenta importar otra vez. No se duplica nada.")+'</p>')}
  else toast("Listo: "+ok+" registros guardados en tu cuenta");
}

function route(){const h=(location.hash||"").replace("#","");return h||"inicio"}

window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});

// ---------- render ----------
function render(){
  const v=route(); const tab=SUBVIEWS[v]||v;
  $("#tabs").innerHTML=TABS.map(([k,l,i])=>'<button type="button" data-act="go" data-id="'+k+'" class="'+(tab===k?"on":"")+'">'+I[i]+'<span>'+l+'</span></button>').join("");
  const views={verificaciones:vVerificaciones,solicitudes:vSolicitudes,inicio:vInicio,citas:vCitas,clientes:vClientes,cobros:vCobros,mas:vMas,estimaciones:vEstimaciones,membresias:vMembresias,servicios:vServicios,ajustes:vAjustes,volver:vVolver,finanzas:vFinanzas,guia:vGuia,campanas:vCampanas,campana:vCampana};
  let banner="";
  if(mode==="lento")banner='<div class="banner">Sin conexión por ahora. Puedes seguir trabajando: lo que guardes se sube solo cuando vuelva la señal.</div>';
  else if(mode==="permiso")banner='<div class="banner">Firebase no da permiso para ver tus datos. Revisa que las reglas de Firestore estén publicadas con tu correo. Entraste como: '+esc((auth.currentUser&&auth.currentUser.email)||"?")+'<br><small>'+esc(ultimoError)+'</small></div>';
  else if(mode==="error")banner='<div class="banner">No se pudo conectar con tus datos. Cierra y vuelve a abrir la app.<br><small>'+esc(ultimoError)+'</small></div>';
  let html;
  try{html=(views[v]||vInicio)()}catch(e){html='<div class="banner">Algo falló al mostrar esta pantalla: '+esc(String(e&&e.message||e))+'</div>'}
  $("#view").innerHTML=banner+html;
}

  const est=c.estado==="completada"?(saldo>0?'<span class="pill p-warn">Debe '+money(saldo)+'</span>':'<span class="pill p-ok">Pagada</span>'):c.estado==="cancelada"?'<span class="pill p-mut">Cancelada</span>':'<span class="pill p-info">Programada</span>';
  return '<button type="button" class="row" data-act="verCita" data-id="'+c.id+'"><div class="when"><b>'+(showDate?esc(fDate(c.fecha,{day:"numeric"})):esc((fHora(c.hora)||"—").split(" ")[0]))+'</b><span>'+(showDate?esc(fDate(c.fecha,{month:"short"})):esc((fHora(c.hora)||"").split(" ")[1]||""))+'</span></div><div class="main"><span class="t">'+esc(cliNombre(c.clienteId))+'</span><span class="s">'+esc(c.servicio||"Servicio")+(c.vehiculo?" · "+esc(c.vehiculo):"")+(showDate&&c.hora?" · "+esc(fHora(c.hora)):"")+'</span></div><div class="r"><b>'+(c.usaMembresia?"Membresía":money(c.precio))+'</b>'+est+'</div></button>';
}

function vInicio(){
  const t=today(), mk=mesKey(t);
  const hoy=S.citas.filter(c=>c.fecha===t&&c.estado!=="cancelada").sort((a,b)=>(a.hora||"").localeCompare(b.hora||""));
  const semFin=addDays(t,7);
  const prox=S.citas.filter(c=>c.fecha>t&&c.fecha<=semFin&&c.estado==="programada").sort((a,b)=>(a.fecha+(a.hora||"")).localeCompare(b.fecha+(b.hora||"")));
  const ingresos=S.pagos.filter(p=>mesKey(p.fecha)===mk).reduce((a,p)=>a+num(p.monto),0);
  const porCobrar=S.citas.reduce((a,c)=>a+saldoCita(c),0);
  const renov=S.membresias.filter(m=>m.estado==="activa"&&m.proxCobro&&m.proxCobro<=addDays(t,7)).sort((a,b)=>a.proxCobro.localeCompare(b.proxCobro));
  const estAb=S.estimaciones.filter(e=>e.estado==="enviada"||e.estado==="borrador").length;
  let h=bannerTimer()+'<div class="section"><h1>'+esc(fDate(t,{weekday:"long",day:"numeric",month:"long"}).replace(/^./,m=>m.toUpperCase()))+'</h1></div>';
  const nuevas=S.solicitudes.filter(x=>x.estado==="nueva").sort((a,b)=>(b.creado||0)-(a.creado||0));
  const vNuevas=S.verificaciones.filter(x=>x.estado==="nueva"), vVence=S.verificaciones.filter(x=>x.estado==="verificado"&&x.reverificarEl&&x.reverificarEl<=addDays(t,14));
  if(vNuevas.length||vVence.length)h+='<div class="section"><h2>Planes de trabajo <button type="button" class="lnk" data-act="go" data-id="verificaciones">Ver</button></h2><div class="list">'+vNuevas.map(verRow).join("")+vVence.map(verRow).join("")+'</div></div>';
  if(nuevas.length)h+='<div class="section"><h2>Solicitudes nuevas <span class="pill p-bad">'+nuevas.length+'</span><button type="button" class="lnk" data-act="go" data-id="solicitudes">Ver todas</button></h2><div class="list">'+nuevas.slice(0,5).map(solRow).join("")+'</div></div>';
  h+='<div class="tiles"><div class="tile gold"><span class="k">Cobrado este mes</span><span class="v">'+money(ingresos)+'</span></div><div class="tile"><span class="k">Por cobrar</span><span class="v" style="color:'+(porCobrar>0?"var(--warn)":"inherit")+'">'+money(porCobrar)+'</span></div><div class="tile"><span class="k">Citas hoy</span><span class="v">'+hoy.length+'</span></div><div class="tile"><span class="k">Próximos 7 días</span><span class="v">'+prox.length+'</span></div></div>';
  h+='<div class="quick"><button type="button" data-act="newCita">'+I.cal+'Cita</button><button type="button" data-act="newCliente">'+I.user+'Cliente</button><button type="button" data-act="newEst">'+I.doc+'Cotización</button><button type="button" data-act="newPago">'+I.cash+'Pago</button></div>';
  h+='<div class="section"><h2>Hoy <button type="button" class="lnk" data-act="go" data-id="citas">Ver citas</button></h2>'+(hoy.length?'<div class="list">'+hoy.map(c=>citaRow(c,false)).join("")+'</div>':'<div class="empty">No tienes citas hoy.<button type="button" class="btn sm pri" data-act="newCita">Agendar una cita</button></div>')+'</div>';
  if(prox.length)h+='<div class="section"><h2>Esta semana</h2><div class="list">'+prox.slice(0,6).map(c=>citaRow(c,true)).join("")+'</div></div>';
  const deben=S.citas.filter(c=>saldoCita(c)>0);
  if(deben.length)h+='<div class="section"><h2>Pendientes de pago <button type="button" class="lnk" data-act="go" data-id="cobros">Cobros</button></h2><div class="list">'+deben.slice(0,5).map(c=>citaRow(c,true)).join("")+'</div></div>';
  const man=addDays(t,1),porRec=S.citas.filter(c=>c.estado==="programada"&&c.fecha===man&&!c.recordadoEn).sort((a,b)=>(a.hora||"").localeCompare(b.hora||""));
  if(porRec.length)h+='<div class="section"><h2>Recordar para mañana <span class="pill p-warn">'+porRec.length+'</span></h2><div class="list">'+porRec.map(c=>citaRow(c,false)).join("")+'</div><p class="note">Toca la cita y usa "🔔 Recordatorio" para avisarle al cliente.</p></div>';
  const depPend=S.citas.filter(c=>c.estado==="programada"&&c.depositoPedido&&c.fecha>=t&&!depositoDe(c).length).sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));
  if(depPend.length)h+='<div class="section"><h2>Depósitos pendientes <span class="pill p-warn">'+depPend.length+'</span></h2><div class="list">'+depPend.map(c=>citaRow(c,true)).join("")+'</div></div>';
  const sinRes=S.citas.filter(c=>c.estado==="completada"&&!c.resenaPedida&&c.fecha&&c.fecha>=addDays(t,-7)&&c.fecha<=t).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  if(sinRes.length)h+='<div class="section"><h2>Pedir reseña</h2><div class="list">'+sinRes.slice(0,5).map(c=>citaRow(c,true)).join("")+'</div><p class="note">Toca la cita y usa "Pedir reseña" para mandar tu enlace de Google.</p></div>';
  const volv=clientesVolver();
  if(volv.length)h+='<div class="section"><h2>Clientes para volver <span class="pill p-warn">'+volv.length+'</span><button type="button" class="lnk" data-act="go" data-id="volver">Ver todos</button></h2><div class="list">'+volv.slice(0,4).map(volverRow).join("")+'</div></div>';
  if(renov.length)h+='<div class="section"><h2>Membresías por renovar</h2><div class="list">'+renov.map(memRow).join("")+'</div></div>';
  if(estAb)h+='<div class="section"><h2>Cotizaciones abiertas <button type="button" class="lnk" data-act="go" data-id="estimaciones">Ver '+estAb+'</button></h2></div>';
  if(!S.clientes.length&&!S.citas.length&&mode!=="cargando")h+='<div class="empty"><b style="color:var(--ink)">Para empezar</b>1. Agrega tus servicios y precios.<br>2. Registra tus clientes.<br>3. Agenda tus citas y registra los pagos.<div class="btns"><button type="button" class="btn sm pri" data-act="go" data-id="servicios">Servicios y precios</button><button type="button" class="btn sm" data-act="newCliente">Nuevo cliente</button></div></div>';
  return h;
}

function vCitas(){
  const t=today();
  const F={proximas:["Próximas",c=>c.fecha>=t&&c.estado==="programada"],hoy:["Hoy",c=>c.fecha===t],completadas:["Completadas",c=>c.estado==="completada"],canceladas:["Canceladas",c=>c.estado==="cancelada"],todas:["Todas",()=>true]};
  let list=S.citas.filter(F[citaFiltro][1]);
  const desc=citaFiltro==="completadas"||citaFiltro==="todas"||citaFiltro==="canceladas";
  list.sort((a,b)=>{const x=(a.fecha||"")+(a.hora||""),y=(b.fecha||"")+(b.hora||"");return desc?y.localeCompare(x):x.localeCompare(y)});
  let h='<div class="section"><h2><span style="font-size:22px">Citas</span><button type="button" class="btn sm pri" data-act="newCita">+ Nueva</button></h2><div class="chips">'+Object.keys(F).map(k=>'<button type="button" class="chip '+(citaFiltro===k?"on":"")+'" data-act="citaF" data-id="'+k+'">'+F[k][0]+'</button>').join("")+'</div></div>';
  if(!list.length)return h+'<div class="empty">No hay citas en esta lista.</div>';
  const groups={};list.forEach(c=>{(groups[c.fecha]=groups[c.fecha]||[]).push(c)});
  Object.keys(groups).forEach(f=>{h+='<div class="day">'+(f===t?"Hoy · ":"")+esc(fDate(f,{weekday:"long",day:"numeric",month:"long"}))+'</div><div class="list">'+groups[f].map(c=>citaRow(c,false)).join("")+'</div>'});
  return h;
}

function vClientes(){
  const q=buscar.trim().toLowerCase();
  let list=S.clientes.slice().sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||""));

  h+='<div class="list">'+list.map(c=>{

function vCobros(){

  const total=pagos.reduce((a,p)=>a+num(p.monto)+num(p.propina),0),propinas=pagos.reduce((a,p)=>a+num(p.propina),0);
  const porMetodo={};pagos.forEach(p=>porMetodo[p.metodo||"Otro"]=(porMetodo[p.metodo||"Otro"]||0)+num(p.monto)+num(p.propina));

function tTotal(c){const t=c.timer||{};return num(t.acum)+(t.inicio?Date.now()-num(t.inicio):0)}
function hms(ms){const s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")}
function hTxt(ms){const m=Math.round(ms/60000);const h=Math.floor(m/60);return (h?h+" h ":"")+(m%60)+" min"}
function horaTxt(ts){try{return new Date(num(ts)).toLocaleTimeString("es-US",{hour:"numeric",minute:"2-digit"})}catch(e){return ""}}
function sesionesDe(c){const t=c.timer||{};const ss=(t.sesiones||[]).slice();if(t.inicio)ss.push({ini:t.inicio,fin:null});return ss}
function horasTimer(c){const t=c.timer||{},ss=sesionesDe(c);if(!ss.length)return "";const empezo=t.empezo||ss[0].ini;const fin=t.inicio?null:(t.terminado||ss[ss.length-1].fin);
  let h='<div class="kv" style="margin-top:4px"><div><span>Empezaste</span><span>'+horaTxt(empezo)+'</span></div><div><span>Terminaste</span><span>'+(fin?horaTxt(fin):'<span style="color:var(--muted)">'+(t.inicio?"trabajando…":"en pausa")+'</span>')+'</span></div>';
  if(ss.length>1){const pausas=ss.slice(1).reduce((a,x,i)=>a+(num(x.ini)-num(ss[i].fin||x.ini)),0);
    h+='<div><span>Tramos</span><span style="text-align:right">'+ss.map(x=>horaTxt(x.ini)+" – "+(x.fin?horaTxt(x.fin):"ahora")).join("<br>")+'</span></div>'+(pausas>60000?'<div><span>Pausas</span><span>'+hTxt(pausas)+'</span></div>':"")}
  return h+'</div>'}

function hhmm(ts){if(!ts)return "";const d=new Date(num(ts));return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function formTiempo(id){const c=byId("citas",id);if(!c)return;const t=c.timer||{},ss=sesionesDe(c);const ini=t.empezo||(ss[0]&&ss[0].ini),fin=t.terminado||(ss.length&&ss[ss.length-1].fin);
  openSheet("Tiempo de trabajo",'<input type="hidden" name="id" value="'+id+'"><p class="note" style="margin:0">Pon la hora en que empezaste y en que terminaste. Si tomaste un descanso, ponlo en minutos.</p><div class="g2"><div class="f"><label for="tm_i">Empecé a las</label><input id="tm_i" name="ini" type="time" value="'+hhmm(ini)+'" data-inp="tmCalc"></div><div class="f"><label for="tm_f">Terminé a las</label><input id="tm_f" name="fin" type="time" value="'+hhmm(fin)+'" data-inp="tmCalc"></div></div><div class="f"><label for="tm_p">Descanso (minutos)</label><input id="tm_p" name="pausa" inputmode="numeric" value="0" data-inp="tmCalc"></div><div class="total"><span>Tiempo trabajado</span><span id="tm_tot">'+(c.horasReales?hTxt(c.horasReales*3600000):"—")+'</span></div><p class="note" style="margin:0">O escribe solo el total de horas:</p><div class="f"><label for="tm_h">Horas en total</label><input id="tm_h" name="horas" inputmode="decimal" placeholder="Ej. 2.5" value=""></div>',
  '<button type="button" class="btn" data-act="verCita" data-id="'+id+'">Volver</button><button type="submit" class="btn pri">Guardar tiempo</button>',"tiempo")}
function tmMs(f){const a=f.ini.value,b=f.fin.value;if(!a||!b)return null;const [ah,am]=a.split(":").map(Number),[bh,bm]=b.split(":").map(Number);let m=(bh*60+bm)-(ah*60+am);if(m<0)m+=1440;m-=num(f.pausa.value);return Math.max(0,m)*60000}
async function submitTiempo(f){const id=f.id.value,c=byId("citas",id);if(!c)return;let ms=null,ini=null,fin=null;
  if(num(f.horas.value)>0)ms=Math.round(num(f.horas.value)*3600000);
  else{ms=tmMs(f);if(ms==null)return toast("Pon la hora de inicio y de fin, o el total de horas.");const d=c.fecha||today();ini=new Date(d+"T"+f.ini.value+":00").getTime();fin=new Date(d+"T"+f.fin.value+":00").getTime();if(fin<ini)fin+=864e5}
  await timerSet(id,t=>{t.acum=ms;t.inicio=null;if(ini){t.empezo=ini;t.terminado=fin;t.sesiones=[{ini,fin}]}});toast("Tiempo guardado: "+hTxt(ms));verCita(id)}

function clientesVolver(){const t=today(),dv=diasVolver();const out=[];
  S.clientes.forEach(cl=>{const cs=S.citas.filter(c=>c.clienteId===cl.id);
    if(cs.some(c=>c.estado==="programada"&&c.fecha>=t))return;
    const comp=cs.filter(c=>c.estado==="completada"&&c.fecha).sort((a,b)=>b.fecha.localeCompare(a.fecha));
    if(!comp.length){const canc=cs.filter(c=>c.estado==="cancelada").map(c=>c.canceladaEn||c.fecha).filter(Boolean).concat(cl.canceloEn?[cl.canceloEn]:[]).sort().reverse()[0];if(!canc)return;
      const d=diasEntre(canc,t);if(d<3||d>180)return;if(cl.avisadoEn&&cl.avisadoEn>=canc)return;if(cl.noRecordar&&(cl.noRecordar===true||cl.noRecordar>=canc))return;
      out.push({cl,ult:{fecha:canc,servicio:"Canceló"},dias:d,cancelo:true});return}
    if(memActiva(cl.id))return;
    const ult=comp[0],dias=diasEntre(ult.fecha,t);if(dias<dv)return;if(cl.noRecordar&&(cl.noRecordar===true||cl.noRecordar>=ult.fecha))return;
    if(cl.avisadoEn&&cl.avisadoEn>=ult.fecha&&diasEntre(cl.avisadoEn,t)<dv)return;
    out.push({cl,ult,dias})});
  return out.sort((a,b)=>b.dias-a.dias)}

  S.gastos.filter(g=>(g.fecha||"").startsWith(yr)).forEach(g=>rows.push(["Gasto",g.fecha,g.categoria||"",g.desc||"",num(g.monto),""]));
  S.millas.filter(m=>(m.fecha||"").startsWith(yr)).forEach(m=>rows.push(["Millas",m.fecha,m.nota||"",m.destino||"","",num(m.millas)]));
  rows.sort((a,b)=>a[0]==="Tipo"?-1:b[0]==="Tipo"?1:(a[1]||"").localeCompare(b[1]||""));
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));a.download="autoluxuries-"+yr+".csv";document.body.appendChild(a);a.click();a.remove()}

let FOTOS={},fotoUnsub=null,fotoCita=null;
function cargarFotos(citaId){
  if(fotoCita===citaId&&fotoUnsub){pintarFotos();return}
  if(fotoUnsub){try{fotoUnsub()}catch(e){}}
  fotoCita=citaId;FOTOS={};
  fotoUnsub=fsSnap(fsQuery(fsCol(fs,"fotos"),fsWhere("citaId","==",citaId)),snap=>{FOTOS={};snap.docs.forEach(d=>{FOTOS[d.id]=Object.assign({id:d.id},d.data())});pintarFotos()},e=>handleErr(e));
}
function fotosDe(citaId,tipos){tipos=tipos||["antes","despues"];return Object.values(FOTOS).filter(f=>f.citaId===citaId&&tipos.includes(f.tipo||"despues")).sort((a,b)=>(a.tipo===b.tipo?0:a.tipo==="antes"?-1:1)||num(a.creado)-num(b.creado))}
const TAGF={antes:"Antes",despues:"Después",revision:"Daño"};
function pintarFotos(){document.querySelectorAll(".fotos[data-cita]").forEach(box=>{const tipos=(box.dataset.tipos||"antes,despues").split(",");const fs_=fotosDe(box.dataset.cita,tipos);
  box.innerHTML=fs_.length?fs_.map(f=>'<button type="button" data-act="verFoto" data-id="'+f.id+'"><img src="'+f.data+'" alt="Foto '+(TAGF[f.tipo]||"")+'"><span class="tag">'+(TAGF[f.tipo]||"Foto")+'</span></button>').join(""):'<div class="note" style="grid-column:1/-1;margin:0">'+(tipos.includes("revision")?"Sin fotos de daños.":"Todavía no hay fotos.")+'</div>'});
  document.querySelectorAll("[data-firmabox]").forEach(b=>{const f=fotosDe(b.dataset.firmabox,["firma"])[0];b.innerHTML=f?'<img src="'+f.data+'" alt="Firma del cliente" style="width:100%;max-height:150px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff">':""});
  const sh=$("#ci_fshare"),box=$("#ci_fotos");if(sh&&box)sh.style.display=fotosDe(box.dataset.cita).length?"inline-flex":"none"}
function seccionFotos(id){return '<div class="section"><h2>Fotos</h2><div class="fotos" id="ci_fotos" data-cita="'+id+'" data-tipos="antes,despues"><div class="note" style="grid-column:1/-1;margin:0">Cargando…</div></div><div class="btns" style="margin-top:8px"><label class="btn" for="foto_antes">📷 Fotos de antes</label><label class="btn" for="foto_desp">📷 Fotos de después</label><button type="button" class="btn" id="ci_fshare" data-act="fotosShare" data-id="'+id+'" style="display:none">Enviar fotos al cliente</button></div><input type="file" accept="image/*" multiple class="fotoin" id="foto_antes" data-tipo="antes" data-cita="'+id+'"><input type="file" accept="image/*" multiple class="fotoin" id="foto_desp" data-tipo="despues" data-cita="'+id+'"></div>'}
async function comprimirFoto(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const k=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
    let q=.72,d=cv.toDataURL("image/jpeg",q);while(d.length>850000&&q>.3){q-=.1;d=cv.toDataURL("image/jpeg",q)}return d}
  finally{URL.revokeObjectURL(url)}
}
async function subirFotos(input){
  const files=[...input.files],citaId=input.dataset.cita,tipo=input.dataset.tipo,c=byId("citas",citaId)||{};input.value="";
  if(!files.length)return;toast("Guardando "+files.length+(files.length>1?" fotos…":" foto…"));
  let ok=0;for(const f of files){try{const data=await comprimirFoto(f);await save("fotos",{citaId,clienteId:c.clienteId||"",tipo,data,fecha:today(),creado:Date.now()});ok++}catch(e){}}
  toast(ok===files.length?(ok>1?ok+" fotos guardadas":"Foto guardada"):"No se pudieron guardar "+(files.length-ok)+" foto(s)");
}
function dataToFile(d,name){const b=d.split(",")[1];const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new File([u],name,{type:"image/jpeg"})}
async function compartirFotos(list){
  const files=list.map((f,i)=>dataToFile(f.data,"autoluxuries-"+(f.tipo==="antes"?"antes":"despues")+"-"+(i+1)+".jpg"));
  if(navigator.canShare&&navigator.canShare({files})){try{await navigator.share({files})}catch(e){}return}
  files.forEach((f,i)=>{const a=document.createElement("a");a.href=list[i].data;a.download=f.name;document.body.appendChild(a);a.click();a.remove()});
}

    try{clienteId=await save("clientes",{nombre:o.nuevoNombre,telefono:o.nuevoTel,direccion:o.direccion,vehiculos:nuevosV,creado:today()})}catch(e){return}}
  if(!clienteId)return toast("Elige un cliente.");
  if(!o.fecha)return toast("Elige la fecha.");

function pasosCita(c){const ps=c.pasos||{},t=today(),deps=depositoDe(c),dc=depAjustes(),tm=c.timer||{},emp=!!(tm.empezo||tm.inicio||(tm.sesiones||[]).length),comp=c.estado==="completada";
  const debe=c.usaMembresia?0:Math.max(0,num(c.precio)-pagadoCita(c.id));const out=[];

  if(!c.usaMembresia&&(num(c.precio)>=dc.desde||c.depositoPedido||deps.length)){out.push({k:"dep",n:"Depósito",ok:!!(deps.length||ps.dep||comp||emp)});if(deps.length)out.push({k:"depok",n:"Depósito confirmado",ok:!!(ps.depok||comp||emp)})}

  out.push({k:"lleg",n:"Llegada",ok:!!(ps.lleg||emp||comp)});

  depOkEn:id=>{copyText(msgDepositoOk(byId("citas",id),"en"));marcarPaso(id,"depok")},depOkEs:id=>{copyText(msgDepositoOk(byId("citas",id),"es"));marcarPaso(id,"depok")},
  llegueEn:id=>{copyText(msgLlegue(byId("citas",id),"en"));marcarPaso(id,"lleg")},llegueEs:id=>{copyText(msgLlegue(byId("citas",id),"es"));marcarPaso(id,"lleg")},
  termineEn:id=>{copyText(msgTermine(byId("citas",id),"en"));marcarPaso(id,"fin")},termineEs:id=>{copyText(msgTermine(byId("citas",id),"es"));marcarPaso(id,"fin")},
  cancelarCita:id=>formCancelar(id),

  reactivar:async id=>{const c=byId("citas",id);if(await askConfirm("¿Volver a poner esta cita como programada?","Sí, reactivar")){const n=Object.assign({},c,{estado:"programada"});delete n.motivoCancel;delete n.notaCancel;delete n.canceladaEn;await save("citas",n);toast("Cita reactivada");verCita(id)}},
  verGuia:id=>{const c=byId("citas",id);verGuia(itemsOf(c).map(x=>x.servicio).join(" + "))},
  goGuia:()=>{closeSheet();go("guia")},
  resenaEn:id=>{pedirResena(id,"en");setTimeout(()=>{if($("#modal").innerHTML)verCita(id)},300)},resenaEs:id=>{pedirResena(id,"es");setTimeout(()=>{if($("#modal").innerHTML)verCita(id)},300)},
  verVolver,
  volverCopiarEn:id=>{const cl=byId("clientes",id);copyText(msgVolver(cl,"en"));save("clientes",Object.assign({},cl,{avisadoEn:today()}))},
  volverCopiarEs:id=>{const cl=byId("clientes",id);copyText(msgVolver(cl,"es"));save("clientes",Object.assign({},cl,{avisadoEn:today()}))},
  volverNo:async id=>{const cl=byId("clientes",id);if(await askConfirm("¿Dejar de recordarte este cliente? Si le vuelves a hacer un servicio, se activa de nuevo.","Sí, no recordar")){await save("clientes",Object.assign({},cl,{noRecordar:today()}));closeSheet();toast("Listo")}},
  revisar:id=>formRevision(id),
  firmaBorrar:()=>initFirma(),
  revCompartir:id=>compartirRevision(id),
  newGasto:()=>formGasto(),editGasto:id=>formGasto(id),
  delGasto:async id=>{const gx=byId("gastos",id);if(gx&&gx.fijoId){toast("Es un gasto fijo: bórralo o páusalo en AL Números");return}if(await askConfirm("¿Borrar este gasto?")){removeDoc("gastos",id);closeSheet();toast("Gasto borrado")}},
  newMillas:()=>formMillas(),editMillas:id=>formMillas(id),
  millasCita:id=>{const c=byId("citas",id);formMillas(null,{citaId:id,fecha:c?c.fecha:today()})},
  delMillas:async id=>{if(await askConfirm("¿Borrar estas millas?")){removeDoc("millas",id);closeSheet();toast("Millas borradas")}},
  finMes:id=>{finMes=id;render()},
  finCsv:id=>finCsv(id),
  verFoto:id=>{const f=FOTOS[id];if(!f)return;openSheet(f.tipo==="antes"?"Foto de antes":f.tipo==="revision"?"Foto de daño":"Foto de después",'<img src="'+f.data+'" alt="" style="width:100%;border-radius:12px;display:block">','<button type="button" class="btn danger" data-act="fotoDel" data-id="'+id+'">Borrar</button><button type="button" class="btn" data-act="fotoShare" data-id="'+id+'">Compartir</button><button type="button" class="btn pri" data-act="verCita" data-id="'+f.citaId+'">Volver a la cita</button>')},
  fotoShare:id=>{const f=FOTOS[id];if(f)compartirFotos([f])},
  fotosShare:id=>compartirFotos(fotosDe(id)),
  fotoDel:async id=>{const f=FOTOS[id];if(!f)return;if(await askConfirm("¿Borrar esta foto?")){removeDoc("fotos",id);delete FOTOS[id];toast("Foto borrada");if($("#rv_canvas"))pintarFotos();else verCita(f.citaId)}},
  addCv:()=>{$("#cvs").insertAdjacentHTML("beforeend",cvRow());cvNumerar()},
  delCv:(id,el)=>{const r=el.closest(".cvrow");if($("#cvs").children.length>1)r.remove();else{r.querySelectorAll("input").forEach(i=>i.value="");const svs=r.querySelector(".svs");svs.innerHTML=svRow()}cvNumerar();citaTot()},
  addSv:(id,el)=>{const r=el.closest(".cvrow");r.querySelector(".svs").insertAdjacentHTML("beforeend",svRow());citaTot()},
  delSv:(id,el)=>{const v=el.closest(".svrow"),box=v.parentNode;if(box.children.length>1)v.remove();else{box.innerHTML=svRow()}citaTot()},
  cvAddSaved:(i)=>{const f=document.querySelector('form[data-form="cita"]');const c=byId("clientes",f.clienteId.value);const v=c&&(c.vehiculos||[])[num(i)];if(!v)return;const rows=[...document.querySelectorAll("#cvs .cvrow")];if(rows.some(r=>r.querySelector('[name="cvveh"]').value.toLowerCase()===v.desc.toLowerCase()))return toast("Ese vehículo ya está en la cita");const empty=rows.find(r=>!r.querySelector('[name="cvveh"]').value&&!r.querySelector('[name="cvserv"]').value);if(empty){empty.querySelector('[name="cvveh"]').value=v.desc;empty.querySelector('[name="cvtipo"]').value=v.tipo}else{$("#cvs").insertAdjacentHTML("beforeend",cvRow({tipo:v.tipo,vehiculo:v.desc}))}cvNumerar()},
  addVeh:()=>{$("#vehs").insertAdjacentHTML("beforeend",vehRow())},
  addItem:()=>{$("#items").insertAdjacentHTML("beforeend",itemRow());estTot()},
  delRow:(id,el)=>{const r=el.parentElement;const box=r.parentElement;if(box.children.length>1)r.remove();else r.querySelectorAll("input").forEach(i=>i.value="");estTot()},
  completar:async id=>{const c=byId("citas",id);const rec=Object.assign({},c,{estado:"completada"});try{await save("citas",rec);await contarMembresia(id,rec);toast("Cita completada");setTimeout(()=>verCita(id),50)}catch(e){}},
  copiarCobro:id=>copyText(mensajeCobro(byId("citas",id))),
  confCitaEn:id=>{copyText(msgConfirmCita(byId("citas",id),"en"));marcarPaso(id,"conf")},
  confCitaEs:id=>{copyText(msgConfirmCita(byId("citas",id),"es"));marcarPaso(id,"conf")},
  copiarEst:id=>copyText(textoEst(byId("estimaciones",id))),
  estEnviada:async id=>{try{await save("estimaciones",Object.assign({},byId("estimaciones",id),{estado:"enviada"}));setTimeout(()=>verEst(id),50)}catch(e){}},
  estACita:id=>{const e=byId("estimaciones",id);formCita(null,{clienteId:e.clienteId,tipo:e.tipo,vehiculo:e.vehiculo,servicio:(e.items||[]).map(i=>i.desc).join(" + "),precio:estTotal(e),estId:id,notas:e.notas})},
  memUso:async id=>{const m=byId("membresias",id);try{await save("membresias",Object.assign({},m,{usados:num(m.usados)+1}));setTimeout(()=>verMem(id),50)}catch(e){}},
  memCopiar:id=>{const m=byId("membresias",id),n=negocio(),c=byId("clientes",m.clienteId)||{};copyText("Hola "+(c.nombre||"").split(" ")[0]+", le recordamos que su membresía "+m.planNombre+" de "+n.nombre+" se renueva el "+fDate(m.proxCobro,{day:"numeric",month:"long"})+" por "+money(m.precio)+"."+(n.cobro?"\n\nPuede pagar así:\n"+n.cobro:"")+"\n\n"+n.firma+(n.telefono?"\n"+n.telefono:""))},
  delCliente:async id=>{if(await askConfirm("¿Borrar este cliente? Sus citas y pagos se quedan guardados.")){try{await removeDoc("clientes",id);closeSheet();toast("Cliente borrado")}catch(e){}}},
  delCita:async id=>{if(await askConfirm("¿Borrar esta cita?"+(fotosDe(id).length?" También se borran sus fotos.":""))){try{fotosDe(id,["antes","despues","revision","firma"]).forEach(f=>removeDoc("fotos",f.id));S.millas.filter(m=>m.citaId===id).forEach(m=>removeDoc("millas",m.id));await removeDoc("citas",id);closeSheet();toast("Cita borrada")}catch(e){}}},
  delPago:async id=>{if(await askConfirm("¿Borrar este pago?")){try{await removeDoc("pagos",id);closeSheet();toast("Pago borrado")}catch(e){}}},
  delEst:async id=>{if(await askConfirm("¿Borrar esta cotización?")){try{await removeDoc("estimaciones",id);closeSheet();toast("Cotización borrada")}catch(e){}}},
  delServ:async id=>{if(await askConfirm("¿Borrar este servicio?")){try{await removeDoc("servicios",id);closeSheet()}catch(e){}}},
  delPlan:async id=>{if(await askConfirm("¿Borrar este plan? Los miembros actuales no se borran.")){try{await removeDoc("planes",id);closeSheet()}catch(e){}}},
  delMem:async id=>{if(await askConfirm("¿Borrar esta membresía?")){try{await removeDoc("membresias",id);closeSheet()}catch(e){}}}
};
function estTot(){const f=document.querySelector('form[data-form="est"]');if(!f)return;const t=$("#es_total");if(t)t.textContent=money(estTotal({items:readItems(f),descuento:num(f.descuento.value)}))}
function citaTot(){const f=document.querySelector('form[data-form="cita"]');if(!f)return;f.querySelectorAll("#cvs .cvrow").forEach(r=>{const ps=[...r.querySelectorAll('[name="cvprecio"]')];const sub=r.querySelector(".cvsub");if(sub)sub.textContent=ps.length>1?"Subtotal "+money(ps.reduce((a,i)=>a+num(i.value),0)):""});const base=[...f.querySelectorAll('[name="cvprecio"]')].reduce((a,i)=>a+num(i.value),0);const t=$("#ci_total");if(t)t.textContent=money(totalCita(base,f.descuento.value,f.descTipo.value))}
const CHG={citaTotChg:()=>citaTot(),
  cpGrupo:el=>{const f=el.form;$("#cp_cnt").textContent=clientesGrupo(f.grupo.value,f.excluirCita.checked).length+" clientes con teléfono"},
  cpPlantilla:el=>{const p=PLANTILLAS[el.value];if(!p)return;const f=el.form;f.en.value=p.en;f.es.value=p.es},
  millasCita:el=>{$("#mi_map").innerHTML=el.value?mapsDist(el.value):""},
  citaCli:el=>{const f=el.form,v=el.value;$("#ci_new").style.display=v==="__nuevo"?"grid":"none";const c=byId("clientes",v);if(c){const vehs=c.vehiculos||[];$("#ci_vl").innerHTML=vehs.map(x=>'<option value="'+esc(x.desc)+'"></option>').join("");$("#ci_saved").innerHTML=savedChips(vehs);const r0=f.querySelector("#cvs .cvrow");if(vehs[0]&&r0&&!r0.querySelector('[name="cvveh"]').value){r0.querySelector('[name="cvveh"]').value=vehs[0].desc;r0.querySelector('[name="cvtipo"]').value=vehs[0].tipo}}else{$("#ci_saved").innerHTML=""}if(c&&c.direccion)f.direccion.value=c.direccion;const m=c?memActiva(c.id):null;$("#ci_memwrap").style.display=m?"flex":"none"},
  cvServ:el=>{const r=el.closest(".svrow");r.querySelector('[name="cvservtxt"]').style.display=el.value==="__otro"?"block":"none";const inf=r.querySelector(".cvinfo"),si=servInfo(el.value);inf.innerHTML='<summary>Lo que se hará</summary>'+si;inf.hidden=!si;const s=S.servicios.find(x=>x.nombre===el.value);if(s&&num(s.precio))r.querySelector('[name="cvprecio"]').value=s.precio;citaTot()},
  estCli:el=>{$("#es_new").style.display=el.value==="__nuevo"?"grid":"none";const c=byId("clientes",el.value);if(c&&c.vehiculos&&c.vehiculos[0]){el.form.vehiculo.value=c.vehiculos[0].desc;el.form.tipo.value=c.vehiculos[0].tipo}},
  pagoCli:el=>{const cs=S.citas.filter(c=>c.clienteId===el.value&&c.estado!=="cancelada").sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));$("#pa_cita").innerHTML='<option value="">Ninguna</option>'+opt(cs.map(c=>[c.id,fDate(c.fecha,{day:"numeric",month:"short"})+" · "+(c.servicio||"Servicio")+(saldoCita(c)>0?" · debe "+money(saldoCita(c)):"")]))},
  itemDesc:el=>{const s=S.servicios.find(x=>x.nombre===el.value);const p=el.parentElement.querySelector('[name="iprecio"]');if(s&&num(s.precio)&&!p.value){p.value=s.precio;estTot()}}
};
const SUB={disp:async f=>{const o=fd(f);await saveAjustes(Object.assign({},S.ajustes,{maxPorDia:num(o.maxPorDia),durDefault:num(o.durDefault)||3}));toast("Guardado. Tu página ya muestra los horarios nuevos.")},cliente:submitCliente,cita:submitCita,campana:submitCampana,deposito:submitDeposito,tiempo:submitTiempo,cancelar:submitCancelar,solcancel:submitSolCancel,revision:submitRevision,gasto:submitGasto,millas:submitMillas,extras:async f=>{const o=fd(f);await saveAjustes(Object.assign({},S.ajustes,{resenaUrl:o.resenaUrl||"",diasVolver:num(o.diasVolver)||60,pagoHora:num(o.pagoHora)||25,depositoMonto:num(o.depositoMonto)||50,depositoDesde:num(o.depositoDesde)||250,tarifaMilla:num(o.tarifaMilla)||"",baseDir:o.baseDir||""}));toast("Guardado")},pago:submitPago,est:submitEst,serv:submitServ,plan:submitPlan,mem:submitMem,renovar:submitRenovar,
  ajustes:async f=>{const o=fd(f);try{await saveAjustes(Object.assign({},S.ajustes,{nombre:o.nombre||"AutoLuxuries Auto Detailing",telefono:o.telefono,cobro:o.cobro,firma:o.firma}));toast("Ajustes guardados")}catch(e){}}};

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const fn=ACT[el.dataset.act];if(fn){if(el.dataset.act!=="ovclose")e.preventDefault();fn(el.dataset.id,el,e)}});
document.addEventListener("change",e=>{if(e.target.classList&&e.target.classList.contains("fotoin")){subirFotos(e.target);return}if(e.target.id==="imp_file"&&e.target.files[0]){const f=e.target.files[0];askConfirm("¿Importar este respaldo? Los registros con el mismo código se reemplazan.","Sí, importar").then(ok=>{if(ok)importar(f)});e.target.value="";return}const el=e.target.closest("[data-chg]");if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el)});
document.addEventListener("input",e=>{if(e.target.id==="buscar"){buscar=e.target.value;const pos=e.target.selectionStart;render();const b=$("#buscar");if(b){b.focus();try{b.setSelectionRange(pos,pos)}catch(_){}}}else if(e.target.dataset.inp==="estTot")estTot();else if(e.target.dataset.inp==="citaTot")citaTot();else if(e.target.dataset.inp==="tmCalc"){const ms=tmMs(e.target.form);const t=$("#tm_tot");if(t)t.textContent=ms==null?"—":hTxt(ms)+" · "+money(ms/3600000*pagoHora())}else if(e.target.dataset.inp==="pagoTot"){const t=$("#pa_tot");if(t)t.textContent=money(num($("#pa_m").value)+num($("#pa_t").value))}});
document.addEventListener("submit",e=>{const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();const fn=SUB[f.dataset.form];if(fn)fn(f)});

init();
})();
</script>
