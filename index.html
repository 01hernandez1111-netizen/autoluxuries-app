<style>
/* Layout: app de una columna para celular, blanco y negro como la marca, barra superior negra, navegación fija abajo */
:root{
  --bg:#f4f4f4; --card:#ffffff; --ink:#0d0d0d; --muted:#666666; --line:#e2e2e2;
  --gold:#0d0d0d; --gold-ink:#0d0d0d; --on-gold:#ffffff; --head:#0a0a0a; --head-ink:#ffffff;
  --ok:#2f7d4f; --ok-bg:#e4f2e9; --warn:#a46312; --warn-bg:#fbefd9; --bad:#b23b3b; --bad-bg:#f8e3e3; --info:#2f5d9a; --info-bg:#e3ecf8;
  --display:"Sora",system-ui,sans-serif; --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0b; --card:#161616; --ink:#f2f2f2; --muted:#a0a0a0; --line:#2b2b2b;
    --gold:#ffffff; --gold-ink:#ffffff; --on-gold:#0b0b0b; --head:#000000; --head-ink:#ffffff;
    --ok:#6fcf97; --ok-bg:#16301f; --warn:#f0b35a; --warn-bg:#352612; --bad:#f08080; --bad-bg:#3a1a1a; --info:#8db6ef; --info-bg:#172438;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0b; --card:#161616; --ink:#f2f2f2; --muted:#a0a0a0; --line:#2b2b2b;
  --gold:#ffffff; --gold-ink:#ffffff; --on-gold:#0b0b0b; --head:#000000; --head-ink:#ffffff;
  --ok:#6fcf97; --ok-bg:#16301f; --warn:#f0b35a; --warn-bg:#352612; --bad:#f08080; --bad-bg:#3a1a1a; --info:#8db6ef; --info-bg:#172438;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.login{min-height:100vh;min-height:100dvh;background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.login form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.login .logo{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:.02em}
.login .logo span{font-weight:400;opacity:.85}
.login small{color:#9a9a9a;letter-spacing:.08em;text-transform:uppercase;font-size:12px;margin-top:-10px}
.login .f input,.login input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #2b2b2b;background:#161616;color:#fff}
.login label{font-size:13px;font-weight:700;color:#a0a0a0}
.login .go{background:#fff;color:#0a0a0a;border:0;border-radius:12px;padding:13px;font-weight:700;cursor:pointer}
.login .lnk2{background:none;border:0;color:#cfcfcf;text-decoration:underline;cursor:pointer;align-self:flex-start;padding:0}
.login .err{color:#f08080;font-size:14px;min-height:1em}
.hidden{display:none!important}
header.top{border-bottom:1px solid var(--line);background:var(--head);color:var(--head-ink);padding:calc(14px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 16px calc(18px + env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.02em}
.brand b span{font-weight:400;opacity:.85}
.brand small{font-size:12px;color:#9a9a9a;letter-spacing:.08em;text-transform:uppercase}
.top .plus{background:#ffffff;color:#0a0a0a;border:0;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer}
main{padding:16px;display:flex;flex-direction:column;gap:18px;flex:1}
h1{font-family:var(--display);font-size:22px;margin:0;font-weight:600;text-wrap:balance}
h2{font-family:var(--display);font-size:15px;margin:0;font-weight:600;letter-spacing:.01em;display:flex;align-items:center;justify-content:space-between;gap:8px}
h2 .lnk{font-family:var(--body);font-size:14px;color:var(--gold-ink);background:none;border:0;cursor:pointer;font-weight:600;padding:4px 0}
.section{display:flex;flex-direction:column;gap:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tile .v{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tile.gold{background:var(--head);border-color:var(--line);color:var(--head-ink)}
.tile.gold .k{color:#9a9a9a}.tile.gold .v{color:#ffffff}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--gold) 6%,transparent)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.row .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums;flex-shrink:0}
.when{width:54px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;border-right:1px solid var(--line);padding-right:10px}
.when b{font-family:var(--display);font-size:15px}
.when span{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}.p-mut{background:var(--line);color:var(--muted)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer}
.quick svg{width:22px;height:22px;stroke:var(--gold-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.day{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 2px -2px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs svg{width:22px;height:22px;stroke:currentColor}
nav.tabs button.on{color:var(--gold-ink)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:7px 11px;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.menu{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,12,15,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);gap:10px}
.sheet .hd h3{font-family:var(--display);font-size:17px;margin:0;font-weight:600}
.sheet .hd .x{background:none;border:0;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;padding:6px}
.sheet .bd{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet .ft{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:13px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.f textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.itemrow{display:grid;grid-template-columns:1fr 64px 92px 34px;gap:6px;align-items:center}
.vehrow{display:grid;grid-template-columns:120px 1fr 34px;gap:6px;align-items:center}
.itemrow input,.itemrow select,.vehrow input,.vehrow select{padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);width:100%;min-width:0}
.cvrow{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.cvrow select,.cvrow input{padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);width:100%;min-width:0}
.cvrow .cvh{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fotos button{position:relative;padding:0;border:0;background:none;cursor:pointer}
.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:var(--line)}
.fotos .tag{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px}
.fotoin{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.firma{width:100%;height:170px;border:1.5px dashed var(--line);border-radius:12px;background:#fff;touch-action:none;display:block}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chk label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;background:var(--card)}
.guia{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px;margin:0 0 10px}
.guia summary{cursor:pointer;display:flex;flex-direction:column;gap:2px;list-style:none}
.guia summary::-webkit-details-marker{display:none}
.guia summary small{color:var(--muted)}
.guia h4{margin:14px 0 6px;font-size:14px}
.guia ul{margin:0;padding-left:20px;line-height:1.6}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.del{background:none;border:0;color:var(--bad);font-size:20px;cursor:pointer;line-height:1}
.kv{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.kv div:first-child{border-top:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-weight:600;overflow-wrap:anywhere}
.total{display:flex;justify-content:space-between;font-family:var(--display);font-size:18px;font-weight:600;padding:4px 2px}
.note{font-size:14px;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:40;max-width:90%;text-align:center}
.copybox{width:100%;min-height:140px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
a.tel{color:var(--gold-ink);font-weight:600;text-decoration:none}
@media (max-width:400px){.g2{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection as fsCol, doc as fsDoc, setDoc, deleteDoc, onSnapshot as fsSnap, query as fsQuery, where as fsWhere } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCLgJjUAdf6x4s4niznjfWdLb-YRb0hoho",
  authDomain: "autoluxuries.firebaseapp.com",
  projectId: "autoluxuries",
  storageBucket: "autoluxuries.firebasestorage.app",
  messagingSenderId: "315079290347",
  appId: "1:315079290347:web:2f9f470fae7721bce73dae"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
let fs;
try { fs = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { fs = initializeFirestore(fbApp, {}); }
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
(function(){
"use strict";
// ---------- estado ----------
const COLS=["clientes","citas","estimaciones","pagos","planes","membresias","servicios","solicitudes","verificaciones","gastos","millas"];
const S={clientes:[],citas:[],estimaciones:[],pagos:[],planes:[],membresias:[],servicios:[],solicitudes:[],verificaciones:[],gastos:[],millas:[],ajustes:{}};
let ultimoError="";
let db=null, mode="cargando", loadedCount=0, citaFiltro="proximas", pagoMes=null, buscar="";
const TIPOS=["Auto","SUV / Camioneta","Pickup","Bote","RV / Casa rodante","Moto","Otro"];
const METODOS=["Efectivo","Zelle","Transferencia bancaria","Tarjeta","Cheque","Otro"];

// ---------- utilidades ----------
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(n)||0);
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n};
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function toD(s){return new Date(s+"T00:00:00")}
function dStr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){const d=toD(s);d.setDate(d.getDate()+n);return dStr(d)}
function addMonths(s,n){const d=toD(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return dStr(d)}
function fDate(s,opt){if(!s)return"";try{return toD(s).toLocaleDateString("es-US",opt||{weekday:"short",day:"numeric",month:"short"})}catch(e){return s}}
function fHora(h){if(!h)return"";const[a,b]=h.split(":");let H=+a;const ap=H>=12?"pm":"am";H=H%12||12;return H+":"+b+" "+ap}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
const byId=(col,id)=>S[col].find(x=>x.id===id);
const cliNombre=id=>{const c=byId("clientes",id);return c?c.nombre:"Sin cliente"};
function pagadoCita(id){return S.pagos.filter(p=>p.citaId===id).reduce((a,p)=>a+num(p.monto),0)}
function saldoCita(c){if(c.estado!=="completada")return 0;return Math.max(0,num(c.precio)-pagadoCita(c.id))}
function memActiva(cid){return S.membresias.find(m=>m.clienteId===cid&&m.estado==="activa")}
function mesKey(s){return (s||"").slice(0,7)}
function negocio(){return Object.assign({nombre:"AutoLuxuries Auto Detailing",telefono:"",cobro:"",firma:"¡Gracias por su preferencia!"},S.ajustes||{})}

function toast(msg){const t=$("#toast");t.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(toast._t);toast._t=setTimeout(()=>t.innerHTML="",2400)}

// ---------- base de datos (Firebase) ----------
let unsubs=[];
function newId(){return fsDoc(fsCol(fs,"clientes")).id}
async function save(col,obj){
  const o=Object.assign({},obj); if(!o.id)o.id=newId(); const id=o.id; delete o.id; o.actualizado=Date.now();
  // no esperamos al servidor: así funciona sin señal y se sincroniza después
  setDoc(fsDoc(fs,col,id),JSON.parse(JSON.stringify(o))).catch(handleErr);
  return id;
}
async function removeDoc(col,id){deleteDoc(fsDoc(fs,col,id)).catch(handleErr)}
async function saveAjustes(o){setDoc(fsDoc(fs,"ajustes","negocio"),o).catch(handleErr)}
function handleErr(e){
  const c=e&&e.code;
  if(c==="permission-denied")toast("Sin permiso para guardar. Revisa las reglas de Firebase.");
  else toast("No se pudo guardar. Intenta otra vez.");
}
function startData(){
  unsubs.forEach(u=>u());unsubs=[];loadedCount=0;mode="cargando";render();
  const timer=setTimeout(()=>{if(mode==="cargando"){mode="lento";render()}},10000);
  COLS.forEach(col=>{
    let first=true;
    unsubs.push(fsSnap(fsCol(fs,col),{includeMetadataChanges:false},snap=>{
      S[col]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      if(first){first=false;loadedCount++;if(loadedCount>=COLS.length){mode="listo";clearTimeout(timer);programarSync()}}
      render();
      if(col==="citas")programarSync();
    },err=>{mode=err&&err.code==="permission-denied"?"permiso":"error";ultimoError=col+": "+((err&&err.code)||"")+" "+((err&&err.message)||"").slice(0,120);clearTimeout(timer);render()}));
  });

function durDefault(){return num(S.ajustes&&S.ajustes.durDefault)||3}
function bloqueados(){return Array.isArray(S.ajustes&&S.ajustes.bloqueados)?S.ajustes.bloqueados.slice():[]}
let ocupadoActual=null, syncTimer=null;
const HORAS_TRABAJO=[8,9,10,11,12,13,14,15,16];
function calcOcupado(){
  const t=today(), maxD=num(S.ajustes.maxPorDia!=null?S.ajustes.maxPorDia:2), out={};
  S.citas.forEach(c=>{
    if(!c.fecha||c.fecha<t||c.estado==="cancelada")return;
    const o=out[c.fecha]||(out[c.fecha]={fecha:c.fecha,horas:[],citas:0,completo:false});
    o.citas++;
    const dur=num(c.duracion)||durDefault();
    if(!c.hora||dur>=9){o.completo=true;return}
    const h0=parseInt(c.hora.split(":")[0],10), m0=parseInt(c.hora.split(":")[1]||"0",10);
    const fin=h0+m0/60+dur;
    HORAS_TRABAJO.forEach(h=>{if(h+1>h0+m0/60&&h<fin&&!o.horas.includes(h))o.horas.push(h)});
  });
  bloqueados().filter(d=>d>=t).forEach(d=>{(out[d]||(out[d]={fecha:d,horas:[],citas:0,completo:false})).completo=true});
  Object.values(out).forEach(o=>{if(maxD>0&&o.citas>=maxD)o.completo=true;if(HORAS_TRABAJO.every(h=>o.horas.includes(h)))o.completo=true;o.horas.sort((a,b)=>a-b);o.dur=durDefault();delete o.citas});
  return out;
}
function programarSync(){clearTimeout(syncTimer);syncTimer=setTimeout(syncOcupado,1500)}
function syncOcupado(){
  if(mode!=="listo"||ocupadoActual===null)return;
  const nuevo=calcOcupado();
  Object.values(nuevo).forEach(o=>{const v=ocupadoActual[o.fecha];if(!v||v.completo!==o.completo||v.dur!==o.dur||JSON.stringify(v.horas||[])!==JSON.stringify(o.horas))setDoc(fsDoc(fs,"ocupado",o.fecha),o).catch(()=>{})});
  Object.keys(ocupadoActual).forEach(f=>{if(!nuevo[f])deleteDoc(fsDoc(fs,"ocupado",f)).catch(()=>{})});
}

async function importar(file){
  let data;try{data=JSON.parse(await file.text())}catch(e){return toast("Ese archivo no es un respaldo válido.")}
  const tareas=[];
  for(const c of COLS){if(Array.isArray(data[c]))for(const r of data[c]){if(r&&r.id){const o=Object.assign({},r);const id=o.id;delete o.id;o.actualizado=Date.now();tareas.push(()=>setDoc(fsDoc(fs,c,id),JSON.parse(JSON.stringify(o))))}}}
  if(data.ajustes&&typeof data.ajustes==="object"&&Object.keys(data.ajustes).length)tareas.push(()=>setDoc(fsDoc(fs,"ajustes","negocio"),Object.assign({},S.ajustes,data.ajustes)));
  let ok=0,mal=0,ultimo="";
  toast("Importando "+tareas.length+" registros… no cierres la app.");
  for(let i=0;i<tareas.length;i+=25){
    const r=await Promise.allSettled(tareas.slice(i,i+25).map(f=>f()));
    r.forEach(x=>{if(x.status==="fulfilled")ok++;else{mal++;ultimo=(x.reason&&x.reason.code)||""}});
    toast("Importando… "+(ok+mal)+" de "+tareas.length);
  }
  if(mal){openSheet("La importación no terminó bien",'<p style="margin:0">Se guardaron <b>'+ok+'</b> registros y fallaron <b>'+mal+'</b>.</p><p class="note" style="margin:0">'+(ultimo==="permission-denied"?"Firebase no dio permiso. Revisa que las reglas de Firestore estén publicadas y que hayas entrado con tu correo.":"Revisa tu conexión a internet e intenta importar otra vez. No se duplica nada.")+'</p>')}
  else toast("Listo: "+ok+" registros guardados en tu cuenta");
}

    if(!comp.length){const canc=cs.filter(c=>c.estado==="cancelada").map(c=>c.canceladaEn||c.fecha).filter(Boolean).concat(cl.canceloEn?[cl.canceloEn]:[]).sort().reverse()[0];if(!canc)return;
      const d=diasEntre(canc,t);if(d<3||d>180)return;if(cl.avisadoEn&&cl.avisadoEn>=canc)return;if(cl.noRecordar&&(cl.noRecordar===true||cl.noRecordar>=canc))return;

    if(memActiva(cl.id))return;
    const ult=comp[0],dias=diasEntre(ult.fecha,t);if(dias<dv)return;if(cl.noRecordar&&(cl.noRecordar===true||cl.noRecordar>=ult.fecha))return;

    const k=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
    let q=.72,d=cv.toDataURL("image/jpeg",q);while(d.length>850000&&q>.3){q-=.1;d=cv.toDataURL("image/jpeg",q)}return d}
  finally{URL.revokeObjectURL(url)}
}

async function submitCita(f){
  const o=fd(f); let clienteId=o.clienteId;
  const items=[...f.querySelectorAll("#cvs .cvrow")].map(r=>{const sv=r.querySelector('[name="cvserv"]').value;return {tipo:r.querySelector('[name="cvtipo"]').value,vehiculo:r.querySelector('[name="cvveh"]').value.trim(),servicio:sv==="__otro"||!sv?r.querySelector('[name="cvservtxt"]').value.trim():sv,precio:num(r.querySelector('[name="cvprecio"]').value)}}).filter(x=>x.vehiculo||x.servicio||x.precio);
  if(!items.length)return toast("Agrega al menos un vehículo o servicio.");
  const base=items.reduce((a,x)=>a+num(x.precio),0);
  o.tipo=items[0].tipo;o.vehiculo=items.map(x=>x.vehiculo).filter(Boolean).join(" + ");o.precio=base;
  const nuevosV=items.filter(x=>x.vehiculo).map(x=>({tipo:x.tipo,desc:x.vehiculo}));
  if(clienteId==="__nuevo"){if(!o.nuevoNombre)return toast("Escribe el nombre del cliente nuevo.");
    try{clienteId=await save("clientes",{nombre:o.nuevoNombre,telefono:o.nuevoTel,direccion:o.direccion,vehiculos:nuevosV,creado:today()})}catch(e){return}}
  if(!clienteId)return toast("Elige un cliente.");
  if(!o.fecha)return toast("Elige la fecha.");
  const servicio=items.map(x=>x.servicio).filter(Boolean).join(" + ");
  const prev=o.id?byId("citas",o.id):null;
  const rec={id:o.id||undefined,clienteId,duracion:num(o.duracion)||durDefault(),tipo:o.tipo,vehiculo:o.vehiculo,servicio,items,fecha:o.fecha,hora:o.hora,direccion:o.direccion,precioBase:num(o.precio),descuento:num(o.descuento),descTipo:o.descTipo||"$",descMotivo:o.descMotivo||"",precio:o.usaMembresia?0:totalCita(o.precio,o.descuento,o.descTipo),estado:o.estado,usaMembresia:!!o.usaMembresia,notas:o.notas,estId:o.estId||"",membresiaContada:prev?!!prev.membresiaContada:false};
  // guardar vehículo en el cliente si es nuevo
  const cli=byId("clientes",clienteId);
  try{
    if(cli){const ya=(cli.vehiculos||[]).map(v=>(v.desc||"").toLowerCase());const add=nuevosV.filter(v=>!ya.includes(v.desc.toLowerCase()));if(add.length)await save("clientes",Object.assign({},cli,{vehiculos:(cli.vehiculos||[]).concat(add)}))}
    const nid=await save("citas",rec);
    await contarMembresia(nid,rec);
    if(o.estId){const e=byId("estimaciones",o.estId);if(e&&e.estado!=="aceptada")await save("estimaciones",Object.assign({},e,{estado:"aceptada"}))}
    if(o.solId){const sl=byId("solicitudes",o.solId);if(sl)await save("solicitudes",Object.assign({},sl,{estado:"aceptada",citaId:nid,clienteId}))}
    closeSheet();toast("Cita guardada");
  }catch(e){}
}
async function contarMembresia(id,c){
  if(c.estado==="completada"&&c.usaMembresia&&!c.membresiaContada){
    const m=memActiva(c.clienteId);
    if(m){await save("membresias",Object.assign({},m,{usados:num(m.usados)+1}));await save("citas",Object.assign({},c,{id,membresiaContada:true}))}
  }
}

  memCopiar:id=>{const m=byId("membresias",id),n=negocio(),c=byId("clientes",m.clienteId)||{};copyText("Hola "+(c.nombre||"").split(" ")[0]+", le recordamos que su membresía "+m.planNombre+" de "+n.nombre+" se renueva el "+fDate(m.proxCobro,{day:"numeric",month:"long"})+" por "+money(m.precio)+"."+(n.cobro?"\n\nPuede pagar así:\n"+n.cobro:"")+"\n\n"+n.firma+(n.telefono?"\n"+n.telefono:""))},
  delCliente:async id=>{if(await askConfirm("¿Borrar este cliente? Sus citas y pagos se quedan guardados.")){try{await removeDoc("clientes",id);closeSheet();toast("Cliente borrado")}catch(e){}}},
  delCita:async id=>{if(await askConfirm("¿Borrar esta cita?"+(fotosDe(id).length?" También se borran sus fotos.":""))){try{fotosDe(id,["antes","despues","revision","firma"]).forEach(f=>removeDoc("fotos",f.id));S.millas.filter(m=>m.citaId===id).forEach(m=>removeDoc("millas",m.id));await removeDoc("citas",id);closeSheet();toast("Cita borrada")}catch(e){}}},
  delPago:async id=>{if(await askConfirm("¿Borrar este pago?")){try{await removeDoc("pagos",id);closeSheet();toast("Pago borrado")}catch(e){}}},
  delEst:async id=>{if(await askConfirm("¿Borrar esta cotización?")){try{await removeDoc("estimaciones",id);closeSheet();toast("Cotización borrada")}catch(e){}}},
  delServ:async id=>{if(await askConfirm("¿Borrar este servicio?")){try{await removeDoc("servicios",id);closeSheet()}catch(e){}}},
  delPlan:async id=>{if(await askConfirm("¿Borrar este plan? Los miembros actuales no se borran.")){try{await removeDoc("planes",id);closeSheet()}catch(e){}}},
  delMem:async id=>{if(await askConfirm("¿Borrar esta membresía?")){try{await removeDoc("membresias",id);closeSheet()}catch(e){}}}
};
function estTot(){const f=document.querySelector('form[data-form="est"]');if(!f)return;const t=$("#es_total");if(t)t.textContent=money(estTotal({items:readItems(f),descuento:num(f.descuento.value)}))}
function citaTot(){const f=document.querySelector('form[data-form="cita"]');if(!f)return;const base=[...f.querySelectorAll('[name="cvprecio"]')].reduce((a,i)=>a+num(i.value),0);const t=$("#ci_total");if(t)t.textContent=money(totalCita(base,f.descuento.value,f.descTipo.value))}
const CHG={citaTotChg:()=>citaTot(),
  millasCita:el=>{$("#mi_map").innerHTML=el.value?mapsDist(el.value):""},
  citaCli:el=>{const f=el.form,v=el.value;$("#ci_new").style.display=v==="__nuevo"?"grid":"none";const c=byId("clientes",v);if(c){const vehs=c.vehiculos||[];$("#ci_vl").innerHTML=vehs.map(x=>'<option value="'+esc(x.desc)+'"></option>').join("");$("#ci_saved").innerHTML=savedChips(vehs);const r0=f.querySelector("#cvs .cvrow");if(vehs[0]&&r0&&!r0.querySelector('[name="cvveh"]').value){r0.querySelector('[name="cvveh"]').value=vehs[0].desc;r0.querySelector('[name="cvtipo"]').value=vehs[0].tipo}}else{$("#ci_saved").innerHTML=""}if(c&&c.direccion)f.direccion.value=c.direccion;const m=c?memActiva(c.id):null;$("#ci_memwrap").style.display=m?"flex":"none"},
  cvServ:el=>{const r=el.closest(".cvrow");r.querySelector('[name="cvservtxt"]').style.display=el.value==="__otro"?"block":"none";r.querySelector(".cvinfo").innerHTML=servInfo(el.value);const s=S.servicios.find(x=>x.nombre===el.value);if(s&&num(s.precio))r.querySelector('[name="cvprecio"]').value=s.precio;citaTot()},
  estCli:el=>{$("#es_new").style.display=el.value==="__nuevo"?"grid":"none";const c=byId("clientes",el.value);if(c&&c.vehiculos&&c.vehiculos[0]){el.form.vehiculo.value=c.vehiculos[0].desc;el.form.tipo.value=c.vehiculos[0].tipo}},
  pagoCli:el=>{const cs=S.citas.filter(c=>c.clienteId===el.value&&c.estado!=="cancelada").sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));$("#pa_cita").innerHTML='<option value="">Ninguna</option>'+opt(cs.map(c=>[c.id,fDate(c.fecha,{day:"numeric",month:"short"})+" · "+(c.servicio||"Servicio")+(saldoCita(c)>0?" · debe "+money(saldoCita(c)):"")]))},
  itemDesc:el=>{const s=S.servicios.find(x=>x.nombre===el.value);const p=el.parentElement.querySelector('[name="iprecio"]');if(s&&num(s.precio)&&!p.value){p.value=s.precio;estTot()}}
};
const SUB={disp:async f=>{const o=fd(f);await saveAjustes(Object.assign({},S.ajustes,{maxPorDia:num(o.maxPorDia),durDefault:num(o.durDefault)||3}));toast("Guardado. Tu página ya muestra los horarios nuevos.")},cliente:submitCliente,cita:submitCita,cancelar:submitCancelar,solcancel:submitSolCancel,revision:submitRevision,gasto:submitGasto,millas:submitMillas,extras:async f=>{const o=fd(f);await saveAjustes(Object.assign({},S.ajustes,{resenaUrl:o.resenaUrl||"",diasVolver:num(o.diasVolver)||60,tarifaMilla:num(o.tarifaMilla)||"",baseDir:o.baseDir||""}));toast("Guardado")},pago:submitPago,est:submitEst,serv:submitServ,plan:submitPlan,mem:submitMem,renovar:submitRenovar,
  ajustes:async f=>{const o=fd(f);try{await saveAjustes(Object.assign({},S.ajustes,{nombre:o.nombre||"AutoLuxuries Auto Detailing",telefono:o.telefono,cobro:o.cobro,firma:o.firma}));toast("Ajustes guardados")}catch(e){}}};

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const fn=ACT[el.dataset.act];if(fn){if(el.dataset.act!=="ovclose")e.preventDefault();fn(el.dataset.id,el,e)}});
document.addEventListener("change",e=>{if(e.target.classList&&e.target.classList.contains("fotoin")){subirFotos(e.target);return}if(e.target.id==="imp_file"&&e.target.files[0]){const f=e.target.files[0];askConfirm("¿Importar este respaldo? Los registros con el mismo código se reemplazan.","Sí, importar").then(ok=>{if(ok)importar(f)});e.target.value="";return}const el=e.target.closest("[data-chg]");if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el)});
document.addEventListener("input",e=>{if(e.target.id==="buscar"){buscar=e.target.value;const pos=e.target.selectionStart;render();const b=$("#buscar");if(b){b.focus();try{b.setSelectionRange(pos,pos)}catch(_){}}}else if(e.target.dataset.inp==="estTot")estTot();else if(e.target.dataset.inp==="citaTot")citaTot()});
document.addEventListener("submit",e=>{const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();const fn=SUB[f.dataset.form];if(fn)fn(f)});

init();
})();
</script>
</body>
